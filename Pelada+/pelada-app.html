<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pelada+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2419;
    --bg2:#132d1f;
    --card:#16321f;
    --card2:#1b3b25;
    --ink:#f4efe1;
    --ink-dim:#a9baa7;
    --line:rgba(244,239,225,.13);
    --gold:#e4b94c;
    --gold-ink:#2b1f06;
    --blue:#4c86c7;
    --red:#c75c42;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body,.root{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #17351f 0%, transparent 55%),
      repeating-linear-gradient(90deg, rgba(244,239,225,.035) 0 1px, transparent 1px 64px),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;}
  .topbar{
    padding:calc(22px + env(safe-area-inset-top)) 20px 14px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .brand{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;display:flex;align-items:center;gap:8px;}
  .brand .ball{font-size:22px;}
  .brand sub, .brand-sub{font-family:'Inter';font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:700;margin-top:-2px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(160deg,var(--gold),#b98a1f);
    color:var(--gold-ink);display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:16px;cursor:pointer;flex-shrink:0;
    border:2px solid rgba(244,239,225,.2);
  }
  .content{flex:1;padding:18px 20px calc(100px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;}
  h1.page-title{font-family:'Bebas Neue';font-size:30px;letter-spacing:1px;margin:4px 0 4px;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:800;margin-bottom:6px;}
  p.lead{color:var(--ink-dim);font-size:13.5px;line-height:1.5;margin:0 0 18px;}

  .card{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card.tight{padding:14px 16px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  .btn{
    font-family:'Inter';font-weight:700;font-size:13.5px;
    border:none;border-radius:10px;padding:12px 16px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-gold{background:var(--gold);color:var(--gold-ink);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--gold);}
  .btn-danger{background:rgba(199,92,66,.18);color:#e8917a;border:1px solid rgba(199,92,66,.4);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12px;border-radius:8px;}

  label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-dim);font-weight:700;display:block;margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input,select{
    width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:11px 12px;font-size:16px;font-family:'Inter';
  }
  input:focus,select:focus{outline:none;border-color:var(--gold);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-dim);
  }
  .chip.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}
  .sub-pill{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:20px;color:var(--ink-dim);border:1px solid var(--line);cursor:pointer;opacity:.6;}
  .sub-pill.active{opacity:1;color:var(--gold);border-color:var(--gold);}
  .resenha-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .resenha-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;}
  .resenha-card:active{border-color:var(--gold);}
  .resenha-icon{font-size:22px;margin-bottom:4px;}
  .resenha-title{font-weight:800;font-size:13px;margin-bottom:3px;}
  .resenha-desc{font-size:11px;color:var(--ink-dim);line-height:1.4;}

  .jersey{
    width:44px;height:44px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:15px;
    background:var(--bg2);border:1px solid var(--line);color:var(--gold);
  }
  .jersey.blue{background:rgba(76,134,199,.18);border-color:var(--blue);color:#a8c9e8;}
  .jersey.red{background:rgba(199,92,66,.18);border-color:var(--red);color:#e8a893;}

  .divider-field{
    height:1px;margin:14px 0;position:relative;
    background:repeating-linear-gradient(90deg,var(--line) 0 8px, transparent 8px 16px);
  }

  .nav{
    position:sticky;bottom:0;left:0;right:0;
    background:rgba(15,36,25,.9);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:10px 6px calc(14px + env(safe-area-inset-bottom));
    max-width:480px;margin:0 auto;width:100%;
  }
  .nav-item{
    background:none;border:none;color:var(--ink-dim);font-family:'Inter';font-size:10.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px;flex:1;
  }
  .nav-item .ic{font-size:19px;}
  .nav-item.active{color:var(--gold);}

  .badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.5px;}
  .badge-open{background:rgba(228,185,76,.18);color:var(--gold);}
  .badge-full{background:rgba(199,92,66,.18);color:#e8917a;}
  .badge-done{background:rgba(76,134,199,.18);color:#a8c9e8;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-dim);}
  .empty .ball{font-size:32px;display:block;margin-bottom:10px;}

  .score-line{font-family:'Bebas Neue';font-size:42px;display:flex;align-items:center;justify-content:center;gap:14px;letter-spacing:1px;}
  .score-line .vs{font-size:16px;color:var(--ink-dim);font-family:'Inter';font-weight:700;}
  .team-label{font-family:'Bebas Neue';font-size:15px;letter-spacing:1px;text-align:center;}
  .team-label.blue{color:#a8c9e8;}
  .team-label.red{color:#e8a893;}

  .list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:700;font-size:14px;flex:1;}
  .list-row .meta{font-size:11.5px;color:var(--ink-dim);}

  .rank-num{font-family:'Bebas Neue';font-size:20px;color:var(--ink-dim);width:26px;}
  .rank-num.g1{color:var(--gold);}

  .modal-bg{position:fixed;inset:0;background:rgba(10,20,14,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--card2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:999px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:80%;text-align:center;
  }

  .pos-rate-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .pos-rate-row .pos-name{width:82px;font-size:12.5px;color:var(--ink-dim);flex-shrink:0;}
  .star-picker{display:flex;gap:2px;flex:1;flex-wrap:wrap;}
  .star-picker .star{font-size:16px;color:var(--line);line-height:1;}
  .star-picker.interactive .star{cursor:pointer;}
  .star-picker .star.filled{color:var(--gold);}
  .pos-rate-row .pos-val{width:20px;text-align:right;font-family:'Bebas Neue';color:var(--gold);font-size:15px;}
  .addr-box{max-height:190px;overflow-y:auto;border-radius:9px;margin-top:2px;}
  .addr-box:not(:empty){border:1px solid var(--line);background:var(--bg2);}
  .addr-suggestion{padding:10px 11px;font-size:12.5px;line-height:1.4;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink-dim);}
  .addr-suggestion:last-child{border-bottom:none;}
  .addr-suggestion:hover{color:var(--ink);background:var(--card);}
  .dial-display{font-family:'Bebas Neue';font-size:36px;text-align:center;color:var(--gold);letter-spacing:1px;margin-bottom:6px;}

  .pix-badge{width:42px;height:42px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(160deg,#32BCAD,#1f8f83);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:19px;}
  .fin-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);font-weight:700;}
  .fin-value{font-weight:700;font-size:14px;margin-top:2px;word-break:break-all;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--gold);color:var(--gold);}
  .hist-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .hist-row:last-child{border-bottom:none;}
  .hist-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .hist-icon-in{background:rgba(111,227,180,.18);color:#6fe3b4;}
  .hist-icon-out{background:rgba(199,92,66,.18);color:#e8917a;}

  .pitch{
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0, transparent 45%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.04) 0 40px, rgba(0,0,0,.03) 40px 80px),
      linear-gradient(180deg, #1f5c34, #12381f);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    margin-bottom:14px;
    position:relative;
    height:min(520px, 68vh);
  }
  .pitch::before{
    content:'';position:absolute;left:50%;top:50%;width:74px;height:74px;
    border:1.5px solid rgba(255,255,255,.22);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  }
  .pitch::after{
    content:'';position:absolute;left:6%;right:6%;top:50%;height:1.5px;
    background:rgba(255,255,255,.22);pointer-events:none;
  }
  .pitch-player-abs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:70px;z-index:1;}
  .pitch-pos-tag{font-size:8.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:4px;}
  .pitch-avatar{
    width:50px;height:50px;border-radius:50%;position:relative;
    background:linear-gradient(160deg,var(--gold),#b98a1f);color:var(--gold-ink);
    display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:17px;
    border:2px solid rgba(255,255,255,.4);box-shadow:0 4px 10px rgba(0,0,0,.35);
  }
  .pitch-avatar-mvp{box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(228,185,76,.55);}
  .pitch-badge{position:absolute;top:-4px;right:-4px;font-size:13px;background:var(--bg);border-radius:50%;padding:1px;line-height:1;}
  .pitch-badge-left{left:-4px;right:auto;}
  .pitch-name{font-size:10.5px;font-weight:700;color:#fff;margin-top:5px;text-align:center;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pitch-nota{font-family:'Bebas Neue';font-size:14px;color:var(--gold);margin-top:1px;}
  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="root" class="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, GoogleAuthProvider, OAuthProvider, signInWithPopup,
  sendEmailVerification, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbU0I5OlgGW6OsImTM2a20pVwnAauwojo",
  authDomain: "pelada-plus-2a245.firebaseapp.com",
  projectId: "pelada-plus-2a245",
  storageBucket: "pelada-plus-2a245.firebasestorage.app",
  messagingSenderId: "187308982872",
  appId: "1:187308982872:web:e0980c8b1e3f1deba5c02d"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();
const appleProvider = new OAuthProvider('apple.com');

function traduzErroAuth(e){
  const code = e && e.code || '';
  const map = {
    'auth/invalid-email':'E-mail inválido.',
    'auth/user-not-found':'Conta não encontrada. Toque em "Criar conta".',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Tente entrar.',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/popup-closed-by-user':'Login cancelado.',
    'auth/operation-not-allowed':'Esse método de login ainda não está disponível.',
    'auth/network-request-failed':'Falha de conexão. Verifique sua internet.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.',
    'auth/missing-email':'Digite seu e-mail no campo acima primeiro.',
  };
  return map[code] || 'Não foi possível entrar. Tente de novo.';
}

(function(){
  const KEY_DATA = 'peladaapp:data';
  const KEY_ME = 'peladaapp:me';
  const POSICOES_POR_CAMPO = {
    'Society': ['Goleiro','Fixo','Ala','Meia','Pivô'],
    'Futsal': ['Goleiro','Fixo','Ala','Pivô'],
    'Campo': ['Goleiro','Zagueiro','Lateral','Volante','Meia','Ponta','Centroavante'],
  };
  function posicoesParaCampo(campoTipo){ return POSICOES_POR_CAMPO[campoTipo] || POSICOES_POR_CAMPO['Campo']; }
  // superset de todas as posições possíveis, pra garantir que starsByPosition sempre tenha a chave que for consultada
  const POSICOES = [...new Set(Object.values(POSICOES_POR_CAMPO).flat())];
  const TIPOS = ['Society','Futsal','Campo','Futebol 7','Futebol 11'];

  let data = { players: [], groups: [], matches: [], associacoes: [] };
  let me = null;
  let associacaoId = null;
  let view = 'loading';
  let ui = { modal:null, groupId:null, matchId:null, toast:null, draftPlayer:null, draftGroup:null, draftMatch:null, loginPhone:'', assocScreen:'list', finEditando:false, draftFinanceiro:null };

  const uid = () => Math.random().toString(36).slice(2,10);
  const genCode = () => Math.random().toString(36).slice(2,8).toUpperCase();
  const randInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const pick = arr => arr[randInt(0,arr.length-1)];

  async function loadAll(){
    onAuthStateChanged(auth, (user)=> routeUser(user));
  }
  async function routeUser(user){
    if(!user){ me = null; view = 'login'; render(); return; }
    const isPasswordProvider = user.providerData.some(p=>p.providerId==='password');
    if(isPasswordProvider && !user.emailVerified){ view = 'verify-email'; render(); return; }
    me = user.uid;
    try{
      const snap = await getDoc(doc(db,'appdata','main'));
      if(snap.exists()){
        const d2 = snap.data();
        data = { players: d2.players||[], groups: d2.groups||[], matches: d2.matches||[], associacoes: d2.associacoes||[] };
      }
    }catch(e){ showToast('Erro ao carregar dados. Tente de novo.'); }
    if(!data.associacoes) data.associacoes = [];
    if(!data.players.find(p=>p.id===me)){
      const providerId = (user.providerData[0] && user.providerData[0].providerId) || 'password';
      ui.draftPlayer = { name: user.displayName||'', usuario: user.email||user.uid, senha:null,
        googleConnected: providerId==='google.com', appleConnected: providerId==='apple.com', whatsapp:'',
        nascimento:'', estado:'', cidade:'', genero:'Masculino', estadoCivil:'Solteiro', filhos:'Não',
        posicaoPrincipal:{}, pe:'Direito', altura:'', peso:'', pe_numero:'', timeCoracao:'',
        stars: Object.fromEntries(CAMPO_TIPOS.map(t=>[t, Object.fromEntries(posicoesParaCampo(t).map(pos=>[pos,5]))])) };
      view = 'onboarding'; render(); return;
    }
    try{ associacaoId = localStorage.getItem('peladaapp:associacaoId') || null; }catch(e){}
    routeAfterLogin();
    render();
  }
  function routeAfterLogin(){
    const a = associacaoId ? data.associacoes.find(x=>x.id===associacaoId) : null;
    if(!a || !a.memberIds.includes(me)) associacaoId = null;
    view = associacaoId ? 'home' : 'associacoes';
  }
  async function saveData(){
    try{ await setDoc(doc(db,'appdata','main'), data); }
    catch(e){ showToast('Erro ao salvar. Tente de novo.'); }
  }
  async function saveMe(){
    try{ localStorage.setItem('peladaapp:associacaoId', associacaoId||''); }catch(e){}
  }
  function showToast(msg){ ui.toast = msg; render(); setTimeout(()=>{ ui.toast=null; render(); }, 2400); }

  function myPlayer(){ return data.players.find(p=>p.id===me); }
  function playerById(id){ return data.players.find(p=>p.id===id); }
  function groupById(id){ return data.groups.find(g=>g.id===id); }
  function matchById(id){ return data.matches.find(m=>m.id===id); }
  function associacaoById(id){ return data.associacoes.find(a=>a.id===id); }
  function associacaoAtual(){ return associacaoById(associacaoId); }
  function myAssociacoes(){ return data.associacoes.filter(a=>a.memberIds.includes(me)); }
  function myGroups(){ return data.groups.filter(g => g.associacaoId===associacaoId && g.memberIds.includes(me)); }
  function groupMatches(gid){ return data.matches.filter(m=>m.groupId===gid).sort((a,b)=> a.date.localeCompare(b.date)); }

  function estrelasPara(p, campoTipo, pos){
    return (p.starsByPosition && p.starsByPosition[campoTipo] && p.starsByPosition[campoTipo][pos]!=null) ? p.starsByPosition[campoTipo][pos] : 5;
  }
  function campoTipoAtual(){ const a=associacaoAtual(); return a ? a.campoTipo : 'Campo'; }
  function avgStars(p, campoTipo){
    const tipo = campoTipo || campoTipoAtual();
    const grupo = (p.starsByPosition && p.starsByPosition[tipo]) || {};
    const v = Object.values(grupo);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 5;
  }
  function ovr(p, campoTipo){ return Math.round(avgStars(p, campoTipo)*10); }
  function posicaoPrincipalPara(p, campoTipo){
    if(p.posicaoPrincipal && p.posicaoPrincipal[campoTipo]) return p.posicaoPrincipal[campoTipo];
    if(p.posicao && posicoesParaCampo(campoTipo).includes(p.posicao)) return p.posicao;
    return posicoesParaCampo(campoTipo)[0];
  }
  function matchPos(m,p){
    if(m.positionByPlayer && m.positionByPlayer[p.id]) return m.positionByPlayer[p.id];
    const a = associacaoAtual();
    return posicaoPrincipalPara(p, a ? a.campoTipo : 'Campo');
  }
  function matchRating(m,p){ return estrelasPara(p, campoTipoAtual(), matchPos(m,p)); }

  function computeFormation(n, posicoesLinha){
    const k = posicoesLinha.length;
    const base = Math.floor(n/k);
    const rem = n%k;
    const counts = {};
    posicoesLinha.forEach((pos,i)=>{ counts[pos] = base + (i<rem?1:0); });
    return counts;
  }
  function bucketPosicao(pos){ return pos; }
  const TEAM_COLORS = ['#4c86c7','#c75c42','#4caf7c','#a374c7','#c7a34c','#4cc7c0','#d47ab0','#8ca34c'];
  function corTime(idx){ return TEAM_COLORS[idx % TEAM_COLORS.length]; }
  function jogadoresDoTime(m, slot){
    const idx = slot==='A' ? m.timeA : m.timeB;
    return (m.times && m.times[idx]) || [];
  }
  const POS_ABBR = {Goleiro:'GOL', Zagueiro:'ZAG', Lateral:'LAT', 'Ala/Lateral':'ALA', Volante:'VOL', Meia:'MEI', Centroavante:'CTA', Ponta:'PON', Atacante:'ATA', Fixo:'FIX', Ala:'ALA', 'Pivô':'PIV'};
  function selecaoDaSemana(assocId){
    const assoc = associacaoById(assocId);
    const tipo = assoc.campoTipo;
    const groupIds = data.groups.filter(g=>g.associacaoId===assocId).map(g=>g.id);
    const matches = data.matches.filter(m=>groupIds.includes(m.groupId) && m.status==='finalizada' && m.times)
      .sort((a,b)=> b.date.localeCompare(a.date));
    const last = matches[0];
    if(!last) return null;
    const participantes = [...jogadoresDoTime(last,'A'), ...jogadoresDoTime(last,'B')];
    let pool = participantes.map(pid=>{
      const pl = playerById(pid); if(!pl) return null;
      const pos = matchPos(last, pl);
      const notasRecebidas = last.avaliacoesFeitas ? Object.values(last.avaliacoesFeitas).map(o=>o[pid]).filter(n=>n!=null) : [];
      const nota = notasRecebidas.length ? (notasRecebidas.reduce((a,b)=>a+b,0)/notasRecebidas.length) : matchRating(last,pl);
      return { pl, bucket: pos, nota };
    }).filter(Boolean);

    function pickBest(predicate, sortKeyFn){
      const matches2 = pool.filter(predicate);
      if(!matches2.length) return null;
      matches2.sort((a,b)=> sortKeyFn(b)-sortKeyFn(a));
      const chosen = matches2[0];
      pool = pool.filter(c=>c!==chosen);
      return chosen;
    }
    // Goleiro: prioriza quem jogou de goleiro; se não teve, usa quem tem melhor nota de goleiro entre os presentes
    let goleiro = pickBest(c=>c.bucket==='Goleiro', c=>c.nota);
    if(!goleiro && pool.length){
      pool.sort((a,b)=> estrelasPara(b.pl,tipo,'Goleiro') - estrelasPara(a.pl,tipo,'Goleiro'));
      const chosen = pool[0];
      goleiro = { pl: chosen.pl, bucket:'Goleiro', nota: estrelasPara(chosen.pl,tipo,'Goleiro') };
      pool = pool.filter(c=>c!==chosen);
    }
    // Vaga de linha: 1º prioriza quem jogou naquela posição no dia; se faltar gente, completa com quem sobrou (melhor nota de estrela pra posição)
    function montarLinha(posicao, qtd){
      const selecionados = [];
      for(let i=0;i<qtd;i++){
        const escolhido = pickBest(c=>c.bucket===posicao, c=>c.nota);
        if(escolhido) selecionados.push(escolhido); else break;
      }
      while(selecionados.length<qtd && pool.length){
        pool.sort((a,b)=> estrelasPara(b.pl,tipo,posicao) - estrelasPara(a.pl,tipo,posicao));
        const chosen = pool[0];
        selecionados.push({ pl: chosen.pl, bucket: posicao, nota: estrelasPara(chosen.pl,tipo,posicao) });
        pool = pool.filter(c=>c!==chosen);
      }
      return selecionados;
    }
    const n = assoc.jogadoresLinha || 7;
    const posicoesLinha = posicoesParaCampo(assoc.campoTipo).filter(p=>p!=='Goleiro');
    const grupoDaPartida = groupById(last.groupId);
    const formacao = (grupoDaPartida && grupoDaPartida.formacaoCustom) ? grupoDaPartida.formacaoCustom : computeFormation(n, posicoesLinha);
    const linhas = posicoesLinha.map(pos=> ({ posicao: pos, jogadores: montarLinha(pos, formacao[pos]||0) }));
    const resultado = { match: last, goleiro: goleiro || null, linhas };
    const todos = [resultado.goleiro, ...linhas.flatMap(l=>l.jogadores)].filter(Boolean);
    resultado.melhorId = todos.length ? todos.slice().sort((a,b)=>b.nota-a.nota)[0].pl.id : null;
    return resultado;
  }
  function spreadLeft(k, edge){
    if(k<=0) return [];
    if(k===1) return [50];
    const start=edge, end=100-edge;
    const arr=[];
    for(let i=0;i<k;i++) arr.push(Math.round(start + (end-start)*i/(k-1)));
    return arr;
  }
  function edgeParaPosicao(pos){
    return (pos.includes('Ala') || pos.includes('Lateral')) ? 6 : 26;
  }
  function renderPitchPlayer(c, posicaoKey, badge, melhorId, top, left){
    const conteudo = !c
      ? `<div class="pitch-pos-tag">${POS_ABBR[posicaoKey]||''}</div><div class="pitch-avatar" style="opacity:.3;">–</div><div class="pitch-name" style="opacity:.4;">Vazio</div>`
      : (()=>{
          const initials = c.pl.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
          const isMelhor = c.pl.id===melhorId;
          return `<div class="pitch-pos-tag">${POS_ABBR[posicaoKey]||''}</div>
            <div class="pitch-avatar${isMelhor?' pitch-avatar-mvp':''}">${initials}${badge?`<span class="pitch-badge">${badge}</span>`:''}${isMelhor?`<span class="pitch-badge pitch-badge-left">⭐</span>`:''}</div>
            <div class="pitch-name">${c.pl.name.split(' ')[0]}</div>
            <div class="pitch-nota">${c.nota.toFixed(1)}</div>`;
        })();
    return `<div class="pitch-player-abs" style="top:${top}%;left:${left}%;">${conteudo}</div>`;
  }
  function agruparLinhasPorFileira(posicoesLinha){
    const filas = [];
    const usados = new Set();
    posicoesLinha.forEach(pos=>{
      if(usados.has(pos)) return;
      if(pos==='Ala' && posicoesLinha.includes('Meia')){
        filas.push(['Ala','Meia']); usados.add('Ala'); usados.add('Meia');
      } else if(pos==='Meia' && posicoesLinha.includes('Ala')){
        // já tratado junto com Ala
      } else {
        filas.push([pos]); usados.add(pos);
      }
    });
    return filas;
  }
  function renderSelecaoSemanaCard(){
    const sel = selecaoDaSemana(associacaoId);
    if(!sel){
      return `<div class="card"><div class="empty" style="padding:20px 0;"><span class="ball">🏆</span>Assim que uma pelada for finalizada e os jogadores avaliados, a seleção da semana aparece aqui.</div></div>`;
    }
    const slots = [];
    slots.push(renderPitchPlayer(sel.goleiro, 'Goleiro', '🧤', sel.melhorId, 9, 50));
    const filas = agruparLinhasPorFileira(sel.linhas.map(l=>l.posicao));
    const k = filas.length;
    filas.forEach((posicoesDaFileira,i)=>{
      const top = k===1 ? 55 : Math.round(28 + (83-28)*(i/(k-1)));
      const jogadoresComPos = [];
      posicoesDaFileira.forEach(pos=>{
        const linha = sel.linhas.find(l=>l.posicao===pos);
        if(linha) linha.jogadores.forEach(j=> jogadoresComPos.push({jogador:j, posicao:pos}));
      });
      spreadLeft(jogadoresComPos.length, edgeParaPosicao(posicoesDaFileira[0])).forEach((left,j)=>{
        const {jogador, posicao} = jogadoresComPos[j];
        slots.push(renderPitchPlayer(jogador, posicao, null, sel.melhorId, top, left));
      });
    });
    return `
      <p class="lead" style="margin:0 0 10px;">📅 ${fmtDate(sel.match.date)} · ⭐ nota do melhor jogador da noite</p>
      <div class="pitch">
        ${slots.join('')}
      </div>
    `;
  }

  function statsForAssociacao(playerId, assocId){
    const groupIds = data.groups.filter(g=>g.associacaoId===assocId).map(g=>g.id);
    const matchesJogadas = data.matches.filter(m => groupIds.includes(m.groupId) && m.status==='finalizada' && m.times &&
      (jogadoresDoTime(m,'A').includes(playerId) || jogadoresDoTime(m,'B').includes(playerId)));
    let gols=0, amarelo=0, vermelho=0, azul=0, vitorias=0, derrotas=0, empates=0;
    matchesJogadas.forEach(m=>{
      gols += (m.golsPorJogador[playerId]||0);
      const c = (m.cartoes && m.cartoes[playerId]) || {};
      amarelo += c.amarelo||0; vermelho += c.vermelho||0; azul += c.azul||0;
      const vencedor = m.placar.A>m.placar.B ? 'A' : (m.placar.B>m.placar.A ? 'B' : 'empate');
      const meuSlot = jogadoresDoTime(m,'A').includes(playerId) ? 'A' : 'B';
      if(vencedor==='empate') empates++; else if(vencedor===meuSlot) vitorias++; else derrotas++;
    });
    const notas = [];
    data.matches.filter(m=>groupIds.includes(m.groupId) && m.avaliacoesFeitas).forEach(m=>{
      Object.values(m.avaliacoesFeitas).forEach(obj=>{ if(obj[playerId]!=null) notas.push(obj[playerId]); });
    });
    return { jogos: matchesJogadas.length, gols, assistencias:0, amarelo, vermelho, azul, vitorias, derrotas, empates,
      notaGeral: notas.length ? notas.reduce((a,b)=>a+b,0)/notas.length : null };
  }

  function buscarEnderecoSugestoes(query){
    clearTimeout(ui.addrTimer);
    const box = document.getElementById('as-endereco-sugestoes');
    if(!box) return;
    if(query.trim().length < 4){ box.innerHTML=''; return; }
    ui.addrTimer = setTimeout(async ()=>{
      try{
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}`);
        const results = await res.json();
        const box2 = document.getElementById('as-endereco-sugestoes');
        if(!box2) return;
        if(!results.length){ box2.innerHTML = `<div class="addr-suggestion" style="cursor:default;">Nenhum endereço encontrado</div>`; return; }
        box2.innerHTML = results.map((r,i)=>`<div class="addr-suggestion" data-addr-i="${i}">${r.display_name}</div>`).join('');
        box2.querySelectorAll('[data-addr-i]').forEach(el=>{
          el.onclick = ()=>{
            const chosen = results[parseInt(el.dataset.addrI)].display_name;
            ui.draftAssoc.endereco = chosen;
            document.getElementById('as-endereco').value = chosen;
            box2.innerHTML = '';
          };
        });
      }catch(e){
        const box3 = document.getElementById('as-endereco-sugestoes');
        if(box3) box3.innerHTML = `<div class="addr-suggestion" style="cursor:default;">Busca indisponível — digite o endereço manualmente</div>`;
      }
    }, 450);
  }

  function attachAssociacoes(){
    if(ui.assocScreen==='create'){
      const step = ui.assocStep || 1;
      if(step===1){
        document.getElementById('as-name').oninput = e=>{ ui.draftAssoc.name = e.target.value; };
        document.querySelectorAll('[data-campo-tipo]').forEach(el=> el.onclick = ()=>{ ui.draftAssoc.campoTipo = el.dataset.campoTipo; render(); });
        document.querySelectorAll('[data-categoria]').forEach(el=> el.onclick = ()=>{ ui.draftAssoc.categoria = el.dataset.categoria; render(); });
        document.getElementById('as-linha').onchange = e=>{ ui.draftAssoc.jogadoresLinha = parseInt(e.target.value); };
        document.querySelector('[data-action="cancelar-associacao"]').onclick = ()=>{ ui.assocScreen='list'; ui.draftAssoc=null; ui.assocStep=1; render(); };
        document.getElementById('as-next1').onclick = ()=>{
          if(!ui.draftAssoc.name.trim()){ showToast('Digite o nome da associação'); return; }
          ui.assocStep = 2; render();
        };
      } else if(step===2){
        document.getElementById('as-mensalidade').oninput = e=>{ ui.draftAssoc.mensalidadeValor = e.target.value; };
        document.getElementById('as-vencimento').oninput = e=>{ ui.draftAssoc.mensalidadeVencimento = e.target.value; };
        document.getElementById('as-pix').oninput = e=>{ ui.draftAssoc.chavePix = e.target.value; };
        document.getElementById('as-multa-atraso').oninput = e=>{ ui.draftAssoc.multaAtraso = e.target.value; };
        document.getElementById('as-multa-falta').oninput = e=>{ ui.draftAssoc.multaFalta = e.target.value; };
        document.getElementById('as-multa-amarelo').oninput = e=>{ ui.draftAssoc.multaCartaoAmarelo = e.target.value; };
        document.getElementById('as-multa-vermelho').oninput = e=>{ ui.draftAssoc.multaCartaoVermelho = e.target.value; };
        document.getElementById('as-multa-azul').oninput = e=>{ ui.draftAssoc.multaCartaoAzul = e.target.value; };
        document.getElementById('as-back2').onclick = ()=>{ ui.assocStep=1; render(); };
        document.getElementById('as-next2').onclick = ()=>{ ui.assocStep = 3; render(); };
      } else if(step===3){
        document.getElementById('as-endereco').oninput = e=>{ ui.draftAssoc.endereco = e.target.value; buscarEnderecoSugestoes(e.target.value); };
        document.getElementById('as-back3').onclick = ()=>{ ui.assocStep=2; render(); };
        document.getElementById('as-next3').onclick = ()=>{
          if(!ui.draftAssoc.endereco.trim()){ showToast('Digite o endereço do campo'); return; }
          ui.assocStep = 4; render();
        };
      } else if(step===4){
        document.querySelectorAll('[data-dia-semana]').forEach(el=> el.onclick = ()=>{
          const dia = el.dataset.diaSemana;
          const idx = ui.draftAssoc.diasSemana.indexOf(dia);
          if(idx===-1) ui.draftAssoc.diasSemana.push(dia); else ui.draftAssoc.diasSemana.splice(idx,1);
          render();
        });
        document.getElementById('as-hora-inicio').onchange = e=>{ ui.draftAssoc.horaInicio = e.target.value; };
        document.getElementById('as-hora-fim').onchange = e=>{ ui.draftAssoc.horaTermino = e.target.value; };
        document.getElementById('as-back4').onclick = ()=>{ ui.assocStep=3; render(); };
        document.getElementById('as-next4').onclick = ()=>{
          if(ui.draftAssoc.diasSemana.length===0){ showToast('Escolha ao menos um dia da semana'); return; }
          if(!ui.draftAssoc.horaInicio || !ui.draftAssoc.horaTermino){ showToast('Preencha os horários de início e término'); return; }
          ui.assocStep = 5; render();
        };
      } else if(step===5){
        const slider = document.getElementById('as-prazo-aval');
        slider.oninput = e=>{
          ui.draftAssoc.prazoAvaliacaoHoras = parseInt(e.target.value);
          document.getElementById('as-prazo-aval-label').textContent = e.target.value+' horas';
          document.querySelectorAll('[data-prazo-sugestao]').forEach(el=>{ el.style.borderColor = (el.dataset.prazoSugestao===e.target.value) ? 'var(--gold)' : 'var(--line)'; });
        };
        document.querySelectorAll('[data-prazo-sugestao]').forEach(el=> el.onclick = ()=>{
          ui.draftAssoc.prazoAvaliacaoHoras = parseInt(el.dataset.prazoSugestao);
          render();
        });
        document.getElementById('as-back5').onclick = ()=>{ ui.assocStep=4; render(); };
        document.getElementById('as-next5').onclick = ()=>{ ui.assocStep = 6; render(); };
      } else {
        document.getElementById('as-back6').onclick = ()=>{ ui.assocStep=5; render(); };
        document.getElementById('as-voltar-final').onclick = ()=>{ ui.assocStep=5; render(); };
        document.querySelector('[data-action="salvar-associacao"]').onclick = async ()=>{
          const d = ui.draftAssoc;
          const a = { id: uid(), name:d.name.trim(), campoTipo:d.campoTipo, categoria:d.categoria,
            endereco:d.endereco.trim(), diasSemana:[...d.diasSemana], horaInicio:d.horaInicio, horaTermino:d.horaTermino,
            jogadoresLinha:d.jogadoresLinha, mensalidadeValor: parseFloat(d.mensalidadeValor)||0,
            mensalidadeVencimento: parseInt(d.mensalidadeVencimento)||null, chavePix: d.chavePix.trim(),
            multaAtraso: parseFloat(d.multaAtraso)||0, multaFalta: parseFloat(d.multaFalta)||0,
            multaCartaoAmarelo: parseFloat(d.multaCartaoAmarelo)||0, multaCartaoVermelho: parseFloat(d.multaCartaoVermelho)||0,
            multaCartaoAzul: parseFloat(d.multaCartaoAzul)||0,
            prazoAvaliacaoHoras: d.prazoAvaliacaoHoras,
            code: genCode(), adminId:me, memberIds:[me], moderadores:[], diaristas:[],
            memberSince:{[me]: new Date().toISOString().slice(0,10)} };
          data.associacoes.push(a);
          associacaoId = a.id;
          ui.assocScreen='list'; ui.draftAssoc=null; ui.assocStep=1;
          await saveData(); await saveMe();
          view='home'; showToast('Associação criada! Código: '+a.code); render();
        };
      }
      return;
    }
    document.querySelectorAll('[data-goto]').forEach(el=> el.onclick = ()=>{ view = el.dataset.goto; render(); });
    document.querySelector('[data-action="nova-associacao"]').onclick = ()=>{ ui.assocScreen='create'; ui.assocStep=1; ui.draftAssoc=novoDraftAssoc(); render(); };
    document.querySelectorAll('[data-enter-assoc]').forEach(el=> el.onclick = async ()=>{
      associacaoId = el.dataset.enterAssoc; await saveMe(); view='home'; render();
    });
    document.getElementById('as-code').oninput = e=>{ ui.joinCode = e.target.value; };
    document.querySelector('[data-action="entrar-codigo"]').onclick = async ()=>{
      const code = (document.getElementById('as-code').value||'').trim().toUpperCase();
      if(!code){ showToast('Digite o código da associação'); return; }
      const a = data.associacoes.find(x=>x.code===code);
      if(!a){ showToast('Código inválido'); return; }
      if(!a.memberIds.includes(me)){
        a.memberIds.push(me);
        a.memberSince = a.memberSince || {};
        a.memberSince[me] = new Date().toISOString().slice(0,10);
      }
      data.groups.filter(g=>g.associacaoId===a.id).forEach(g=>{
        if(!g.memberIds.includes(me)){
          g.memberIds.push(me);
          g.memberSince = g.memberSince || {};
          g.memberSince[me] = new Date().toISOString().slice(0,10);
        }
      });
      associacaoId = a.id; ui.joinCode='';
      await saveData(); await saveMe();
      view='home'; showToast('Você entrou na associação!'); render();
    };
    const logoutBtn = document.querySelector('[data-action="logout"]');
    if(logoutBtn) logoutBtn.onclick = async ()=>{ try{ await signOut(auth); }catch(e){} };
  }

  function attachOnboarding(){
    const step = ui.obStep || 1;
    if(step===1){
      document.getElementById('ob-name').oninput = e=>{ ui.draftPlayer.name = e.target.value; };
      document.getElementById('ob-whats').oninput = e=>{ ui.draftPlayer.whatsapp = e.target.value; };
      document.getElementById('ob-nasc').onchange = e=>{ ui.draftPlayer.nascimento = e.target.value; };
      document.getElementById('ob-estado').onchange = e=>{ ui.draftPlayer.estado = e.target.value; };
      document.getElementById('ob-cidade').oninput = e=>{ ui.draftPlayer.cidade = e.target.value; };
      document.querySelectorAll('[data-genero]').forEach(el=> el.onclick = ()=>{ ui.draftPlayer.genero = el.dataset.genero; render(); });
      document.querySelectorAll('[data-civil]').forEach(el=> el.onclick = ()=>{ ui.draftPlayer.estadoCivil = el.dataset.civil; render(); });
      document.querySelectorAll('[data-filhos]').forEach(el=> el.onclick = ()=>{ ui.draftPlayer.filhos = el.dataset.filhos; render(); });
      document.getElementById('ob-next').onclick = ()=>{
        const d = ui.draftPlayer;
        if(!d.name.trim()){ showToast('Digite seu nome'); return; }
        if(!d.whatsapp.trim()){ showToast('Digite seu WhatsApp'); return; }
        if(!d.nascimento){ showToast('Preencha sua data de nascimento'); return; }
        if(!d.estado || !d.cidade.trim()){ showToast('Preencha estado e cidade'); return; }
        ui.obStep = 2; render();
      };
    } else if(step===2){
      document.getElementById('ob-back').onclick = ()=>{ ui.obStep = 1; render(); };
      document.querySelectorAll('[data-pe]').forEach(el=> el.onclick = ()=>{ ui.draftPlayer.pe = el.dataset.pe; render(); });
      document.getElementById('ob-altura').oninput = e=>{ ui.draftPlayer.altura = e.target.value; };
      document.getElementById('ob-peso').oninput = e=>{ ui.draftPlayer.peso = e.target.value; };
      document.getElementById('ob-penumero').oninput = e=>{ ui.draftPlayer.pe_numero = e.target.value; };
      document.getElementById('ob-time').oninput = e=>{ ui.draftPlayer.timeCoracao = e.target.value; buscarTimeSugestoes(e.target.value); };
      document.getElementById('ob-next2').onclick = ()=>{ ui.obStep = 3; render(); };
    } else {
      const backBtn = document.getElementById('ob-back'+step);
      if(backBtn) backBtn.onclick = ()=>{ ui.obStep = step-1; render(); };
      document.querySelectorAll('[data-pos-principal]').forEach(el=> el.onclick = ()=>{
        ui.draftPlayer.posicaoPrincipal[el.dataset.posPrincipal] = el.dataset.posVal; render();
      });
      document.querySelectorAll('[data-star-val]').forEach(el=> el.onclick = ()=>{
        ui.draftPlayer.stars[el.dataset.starCampo][el.dataset.starPos] = parseInt(el.dataset.starVal); render();
      });
      const nextBtn = document.getElementById('ob-next'+step);
      if(nextBtn) nextBtn.onclick = ()=>{ ui.obStep = step+1; render(); };
      const saveBtn = document.getElementById('ob-save');
      if(saveBtn) saveBtn.onclick = async ()=>{
        const d = ui.draftPlayer;
        const p = { id: me, name:d.name.trim(), usuario:d.usuario, senha:d.senha, googleConnected:d.googleConnected,
          whatsapp:d.whatsapp.trim(), nascimento:d.nascimento, estado:d.estado, cidade:d.cidade.trim(),
          genero:d.genero, estadoCivil:d.estadoCivil, filhos:d.filhos,
          posicaoPrincipal:{...d.posicaoPrincipal}, posicao:d.posicaoPrincipal['Campo']||d.posicaoPrincipal['Society'],
          pe:d.pe, altura:d.altura, peso:d.peso, pe_numero:d.pe_numero, timeCoracao:d.timeCoracao.trim(),
          starsByPosition:{...d.stars}, foto:null,
          stats:{ jogos:0, gols:0, assistencias:0, vitorias:0, empates:0, derrotas:0, cartoes:0 } };
        data.players.push(p);
        me = p.id;
        await saveData(); await saveMe();
        ui.draftPlayer = null; ui.obStep = 1;
        routeAfterLogin();
        render();
      };
    }
  }
  function buscarTimeSugestoes(query){
    clearTimeout(ui.timeSearchTimer);
    const box = document.getElementById('ob-time-sugestoes');
    if(!box) return;
    if(query.trim().length < 3){ box.innerHTML=''; return; }
    ui.timeSearchTimer = setTimeout(async ()=>{
      try{
        const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(query)}`);
        const json = await res.json();
        const times = json.teams || [];
        const box2 = document.getElementById('ob-time-sugestoes');
        if(!box2) return;
        if(!times.length){ box2.innerHTML = `<div class="addr-suggestion" style="cursor:default;">Nenhum time encontrado</div>`; return; }
        box2.innerHTML = times.slice(0,6).map((t,i)=>`<div class="addr-suggestion" data-time-i="${i}">${t.strTeam}${t.strLeague?' · '+t.strLeague:''}</div>`).join('');
        box2.querySelectorAll('[data-time-i]').forEach(el=>{
          el.onclick = ()=>{
            const nome = times[parseInt(el.dataset.timeI)].strTeam;
            ui.draftPlayer.timeCoracao = nome;
            document.getElementById('ob-time').value = nome;
            box2.innerHTML = '';
          };
        });
      }catch(e){
        const box3 = document.getElementById('ob-time-sugestoes');
        if(box3) box3.innerHTML = `<div class="addr-suggestion" style="cursor:default;">Busca indisponível — digite manualmente</div>`;
      }
    }, 450);
  }

  function capacidadeMatch(m,g){ return (m.maxJogadores||g.maxPlayers) + (m.maxGoleiros||0); }
  function matchBadge(m,g){

    if(m.status==='finalizada') return `<span class="badge badge-done">Finalizada</span>`;

  const MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function mesAtualKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function mesLabel(key){ const [y,m]=key.split('-'); return MESES_NOMES[parseInt(m)-1]+'/'+y; }
  function fmtDateFull(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
  function fmtDataHora(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return '';
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

  function proximaDataParaDia(diaNome){
    const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const alvo = dias.indexOf(diaNome);
    const hoje = new Date();
    if(alvo<0) return hoje.toISOString().slice(0,10);
    const diff = (alvo - hoje.getDay() + 7) % 7;
    const data = new Date(hoje); data.setDate(hoje.getDate() + diff);
    return data.toISOString().slice(0,10);
  }
  function proximaDataEntreDias(diasSemana){
    if(!diasSemana || diasSemana.length===0) return new Date().toISOString().slice(0,10);
    const nomesDias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const hoje = new Date();
    let melhorDiff = null;
    diasSemana.forEach(dia=>{
      const alvo = nomesDias.indexOf(dia);
      if(alvo<0) return;
      const diff = (alvo - hoje.getDay() + 7) % 7;
      if(melhorDiff===null || diff<melhorDiff) melhorDiff = diff;
    });
    if(melhorDiff===null) return hoje.toISOString().slice(0,10);
    const data = new Date(hoje); data.setDate(hoje.getDate() + melhorDiff);
    return data.toISOString().slice(0,10);
  }
  function calcularSaldoJogador(pid, a, mesKey){
    a.pagamentosMensalidade = a.pagamentosMensalidade || {};
    a.cartoesQuitados = a.cartoesQuitados || {};
    const registro = (a.pagamentosMensalidade[mesKey] || {})[pid];
    const pago = !!(registro && registro.pago);
    const stats = statsForAssociacao(pid, associacaoId);
    const quitado = a.cartoesQuitados[pid] || {amarelo:0, vermelho:0, azul:0};
    const itens = [];
    if(!pago && a.mensalidadeValor){

      if(a.multaAtraso) itens.push({label:'Multa por atraso', valor:a.multaAtraso});
    }
    const amareloDevido = Math.max(0, (stats.amarelo||0) - (quitado.amarelo||0));
    const vermelhoDevido = Math.max(0, (stats.vermelho||0) - (quitado.vermelho||0));
    const azulDevido = Math.max(0, (stats.azul||0) - (quitado.azul||0));
    if(amareloDevido && a.multaCartaoAmarelo) itens.push({label:`🟨 Cartão amarelo ×${amareloDevido}`, valor: amareloDevido*a.multaCartaoAmarelo});
    if(vermelhoDevido && a.multaCartaoVermelho) itens.push({label:`🟥 Cartão vermelho ×${vermelhoDevido}`, valor: vermelhoDevido*a.multaCartaoVermelho});
    if(azulDevido && a.multaCartaoAzul) itens.push({label:`🟦 Cartão azul ×${azulDevido}`, valor: azulDevido*a.multaCartaoAzul});
    const total = itens.reduce((s,i)=>s+i.valor,0);

  function janelaConfirmacaoStatus(m){
    if(!m.confirmInicioData || !m.confirmFimData) return 'sempre';
    const agora = new Date();
    const inicio = new Date(`${m.confirmInicioData}T${m.confirmInicioHora||'00:00'}`);
    const fim = new Date(`${m.confirmFimData}T${m.confirmFimHora||'23:59'}`);
    if(agora<inicio) return 'antes';
    if(agora>fim) return 'depois';
    return 'aberto';
  }
  function tamanhoTime(g){ return Math.max(2, Math.floor(g.maxPlayers/2)); }
  function sortearComFila(ids, m, tamanho){
    const jogadores = ids.map(playerById).filter(Boolean);
    const numTimes = Math.floor(jogadores.length / tamanho);
    if(numTimes < 1) return { times: [], reservas: jogadores.map(p=>p.id) };
    const tipoCampo = associacaoAtual() ? associacaoAtual().campoTipo : 'Campo';
    const ordemPos = posicoesParaCampo(tipoCampo);

    // separa quem jogou de goleiro hoje; se não tiver um pra cada time, completa com quem tem melhor nota de goleiro
    let goleiros = jogadores.filter(p=>matchPos(m,p)==='Goleiro').sort((a,b)=> matchRating(m,b)-matchRating(m,a));
    let linha = jogadores.filter(p=>matchPos(m,p)!=='Goleiro');
    while(goleiros.length < numTimes && linha.length){
      linha.sort((a,b)=> estrelasPara(b,tipoCampo,'Goleiro') - estrelasPara(a,tipoCampo,'Goleiro'));
      goleiros.push(linha.shift());
    }
    const golsExtras = goleiros.slice(numTimes).sort((a,b)=> matchRating(m,b)-matchRating(m,a));
    goleiros = goleiros.slice(0, numTimes);

    // ordena a linha por posição (na ordem do tipo de campo da associação) e nota, pra distribuir em blocos equilibrados
    linha.sort((a,b)=>{
      const pa = ordemPos.indexOf(matchPos(m,a)), pb = ordemPos.indexOf(matchPos(m,b));
      if(pa!==pb) return pa-pb;
      return matchRating(m,b)-matchRating(m,a);
    });
    const poolLinha = [...linha, ...golsExtras]; // goleiros excedentes viram reserva de linha, entram por último

    const times = goleiros.map(gk=>[gk.id]);
    let idx=0, timeAtual=0, sentido=1;
    while(idx<poolLinha.length && times.some(t=>t.length<tamanho)){
      if(times[timeAtual].length < tamanho){ times[timeAtual].push(poolLinha[idx].id); idx++; }
      timeAtual += sentido;
      if(timeAtual>=numTimes){ timeAtual=numTimes-1; sentido=-1; }
      else if(timeAtual<0){ timeAtual=0; sentido=1; }
    }
    // ordena cada elenco: goleiro primeiro, depois na ordem de posições do tipo de campo
    times.forEach(t=> t.sort((a,b)=> ordemPos.indexOf(matchPos(m,playerById(a))) - ordemPos.indexOf(matchPos(m,playerById(b)))));
    return { times, reservas: poolLinha.slice(idx).map(p=>p.id) };
  }

        <h1 class="page-title" style="font-size:22px;">✏️ Alterar pelada</h1>
        <label>Data da pelada</label><input id="alt-date" type="date" value="${d.date}">
        <label>Hora de início</label><input id="alt-hora-ini" type="time" value="${d.horaInicio}">
        <label>Hora de término</label><input id="alt-hora-fim" type="time" value="${d.horaFim}">
        <label>Local</label><input id="alt-local" value="${d.local}">
        <div class="row" style="gap:8px;">
          <div style="flex:1;"><label>Data limite</label><input id="alt-limite-data" type="date" value="${d.limiteData}"></div>
          <div style="flex:1;"><label>Hora limite</label><input id="alt-limite-hora" type="time" value="${d.limiteHora}"></div>
        </div>
        <button class="btn btn-gold btn-block" style="margin-top:16px;" data-action="salvar-alterar-pelada">Salvar</button>
      </div></div>
    `;
  }
  // Chegadas → Times → Ao vivo em sequência, com um submenu discreto pra pular entre etapas já liberadas
  function subEstagioPadrao(m){ return m.times ? 'acoes' : 'chegadas'; }
  function renderTabPartidaSequencial(m,g){
    const sub = ui.matchSubTab || subEstagioPadrao(m);
    const souAdmin = g.adminId===me;
    const passos = [ {key:'chegadas', label:'📍 Chegadas'}, {key:'times', label:'⚖️ Times'}, {key:'acoes', label:'🔴 Ao vivo'} ];
    const liberadoAte = m.times ? 2 : 0; // chegadas sempre liberado; times só depois de chegadas; ao vivo só depois de sortear
    const idx = passos.findIndex(p=>p.key===sub);
    let conteudo, continuar='';
    if(sub==='chegadas'){
      conteudo = renderTabChegadas(m,g);
      if(souAdmin && m.status!=='finalizada') continuar = `<button class="btn btn-gold btn-block" style="margin-top:14px;" data-action="continuar-times">Continuar para Times →</button>`;
    } else if(sub==='times'){
      conteudo = renderTabTimes(m,g);
    } else {
      conteudo = renderTabAcoes(m,g);
    }
    return `
      <div class="row" style="justify-content:center;gap:6px;margin-bottom:12px;">
        ${passos.map((p,i)=>`<div class="sub-pill ${sub===p.key?'active':''}" data-msub="${p.key}">${p.label}</div>`).join('')}
      </div>
      ${conteudo}
      ${continuar}
    `;
  }

  function renderTabConfirmacoes(m,g){
    const p = myPlayer();
    const isConfirmed = m.confirmed.includes(me);
    const isWaiting = m.waitlist.includes(me);
    const myStatus = isConfirmed ? 'vou' : (m.declined.includes(me) ? 'nao' : null);
    const status = janelaConfirmacaoStatus(m);
    const souAdmin = g.adminId===me;
    const janelaTexto = (m.confirmInicioData && m.confirmFimData)
      ? `Confirmações de ${fmtDate(m.confirmInicioData)} ${m.confirmInicioHora||''} até ${fmtDate(m.confirmFimData)} ${m.confirmFimHora||''}`
      : 'Sem janela definida — confirmação sempre aberta.';
    const limitesTexto = `Até ${m.maxJogadores||g.maxPlayers} jogadores${m.maxGoleiros!=null?' · até '+m.maxGoleiros+' goleiros':''}`;

    let bloco = '';
    if(status==='aberto' || status==='sempre'){
      bloco = `
        <div class="card">
          <div class="eyebrow">Você vai participar?</div>
          <div class="chip-row">
            <div class="chip ${myStatus==='vou'?'active':''}" data-confirm="vou">✅ Confirmado</div>
            <div class="chip ${myStatus==='nao'?'active':''}" data-confirm="nao">❌ Não vou</div>
          </div>
          ${isWaiting ? `<p class="lead" style="margin-top:10px;color:var(--gold);">Você está na lista de espera.</p>` : ''}
        </div>`;
      if(isConfirmed){
        bloco += `
        <div class="card">
          <div class="eyebrow">Hoje você quer jogar de:</div>
          <div class="chip-row">${posicoesParaCampo(associacaoAtual()?associacaoAtual().campoTipo:'Campo').map(pos=>`<div class="chip ${matchPos(m,p)===pos?'active':''}" data-pick-pos="${pos}">${pos} ⭐${estrelasPara(p,campoTipoAtual(),pos)}</div>`).join('')}</div>
        </div>`;
      }
    } else if(status==='antes'){
      bloco = `<div class="card"><div class="empty" style="padding:14px 0;"><span class="ball">⏳</span>As confirmações ainda não abriram.</div></div>`;
    } else {
      bloco = `<div class="card"><div class="empty" style="padding:14px 0;"><span class="ball">🔒</span>O período de confirmação encerrou. Só o administrador pode confirmar presença agora.</div></div>`;
      if(souAdmin){
        const membros = g.memberIds.map(playerById).filter(Boolean);
        bloco += `
        <div class="eyebrow" style="margin-top:14px;">Confirmar por outros (admin)</div>
        <div class="card">
          ${membros.map(pl=>{
            const st = m.confirmed.includes(pl.id) ? 'vou' : (m.declined.includes(pl.id) ? 'nao' : '—');
            return `
            <div class="list-row">
              <div class="name" style="flex:1;">${pl.name}</div>
              <div class="chip-row">
                <div class="chip ${st==='vou'?'active':''}" data-admin-confirm="${pl.id}" data-status="vou">Confirmado</div>
                <div class="chip ${st==='nao'?'active':''}" data-admin-confirm="${pl.id}" data-status="nao">Não</div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }
    }

    m.confirmadoEm = m.confirmadoEm || {};
    const porOrdemConfirmacao = (a,b) => (m.confirmadoEm[a.id]||'').localeCompare(m.confirmadoEm[b.id]||'');
    const confirmedPlayers = m.confirmed.map(playerById).filter(Boolean).sort(porOrdemConfirmacao);
    const goleirosConfirmados = confirmedPlayers.filter(pl=>matchPos(m,pl)==='Goleiro');
    const linhaConfirmados = confirmedPlayers.filter(pl=>matchPos(m,pl)!=='Goleiro');
    const waitlistPlayers = m.waitlist.map(playerById).filter(Boolean).sort(porOrdemConfirmacao);
    const ausentes = m.declined.map(playerById).filter(Boolean);
    const linhaJogador = pl => `
      <div class="list-row"><div class="jersey">⭐${matchRating(m,pl)}</div>
        <div><div class="name">${pl.name}</div><div class="meta">jogando de ${matchPos(m,pl)} · ${fmtDataHora(m.confirmadoEm[pl.id])}</div></div>
        <div>✅</div>
      </div>`;
    return `
      <p class="lead" style="margin-bottom:2px;">${janelaTexto}</p>
      <p class="lead" style="margin-bottom:12px;">${limitesTexto}</p>
      ${bloco}

      <div class="row" style="margin-top:18px;"><div class="eyebrow" style="margin:0;">🧤 Goleiros confirmados (${goleirosConfirmados.length}${m.maxGoleiros!=null?'/'+m.maxGoleiros:''})</div></div>
      <div class="card">
        ${goleirosConfirmados.length===0 ? `<p class="lead" style="margin:0;">Nenhum goleiro confirmado ainda.</p>` : goleirosConfirmados.map(linhaJogador).join('')}
      </div>

      <div class="row" style="margin-top:14px;"><div class="eyebrow" style="margin:0;">⚽ Jogadores confirmados (${linhaConfirmados.length}/${m.maxJogadores||g.maxPlayers})</div></div>
      <div class="card">
        ${linhaConfirmados.length===0 ? `<p class="lead" style="margin:0;">Ninguém confirmou ainda.</p>` : linhaConfirmados.map(linhaJogador).join('')}
      </div>

      ${waitlistPlayers.length>0 ? `
        <div class="eyebrow" style="margin-top:14px;">⏳ Lista de espera</div>
        <div class="card">
          ${waitlistPlayers.map(pl=>{
            const ehDiarista = (g.diaristas||[]).includes(pl.id);
            return `
            <div class="list-row"><div class="jersey">⭐${matchRating(m,pl)}</div>
              <div><div class="name">${pl.name}</div><div class="meta">${matchPos(m,pl)} · ${fmtDataHora(m.confirmadoEm[pl.id])}</div>${ehDiarista?`<div class="meta" style="opacity:.7;">Motivo: é diarista</div>`:''}</div>
            </div>`;
          }).join('')}
        </div>` : ''}

      <div class="eyebrow" style="margin-top:14px;">❌ Jogadores ausentes</div>
      <div class="card">
        ${ausentes.length===0 ? `<p class="lead" style="margin:0;">Ninguém marcou ausência ainda.</p>` :
          ausentes.map(pl=>`
            <div class="list-row"><div class="jersey" style="opacity:.5;">⭐${matchRating(m,pl)}</div>
              <div><div class="name" style="opacity:.7;">${pl.name}</div></div>
            </div>`).join('')}
      </div>
    `;
  }

  function renderTabChegadas(m,g){
    m.chegadas = m.chegadas || {};
    const confirmedPlayers = m.confirmed.map(playerById).filter(Boolean);
    const souAdmin = g.adminId===me;
    const chegaram = confirmedPlayers.filter(pl=>m.chegadas[pl.id]).length;
    return `
      <p class="lead">Marque quem já chegou pra dividir os times. ${chegaram}/${confirmedPlayers.length} chegaram.</p>
      <div class="card">
        ${confirmedPlayers.length===0 ? `<p class="lead" style="margin:0;">Ninguém confirmado ainda.</p>` :
          confirmedPlayers.map(pl=>{
            const chegou = !!m.chegadas[pl.id];
            const podeMarcar = souAdmin || pl.id===me;
            return `
            <div class="list-row">
              <div class="jersey" style="width:32px;height:32px;font-size:12px;">${chegou?'📍':'⏳'}</div>
              <div class="name" style="flex:1;">${pl.name}</div>
              ${podeMarcar
                ? `<button class="btn btn-sm ${chegou?'btn-ghost':'btn-gold'}" data-toggle-chegada="${pl.id}">${chegou?'Desfazer':'Cheguei'}</button>`
                : `<span class="badge ${chegou?'badge-done':'badge-open'}">${chegou?'Chegou':'Aguardando'}</span>`}
            </div>`;
          }).join('')}
      </div>
    `;
  }

  function renderTabTimes(m,g){
    m.chegadas = m.chegadas || {};
    const chegaramIds = m.confirmed.filter(id=>m.chegadas[id]);
    const baseIds = chegaramIds.length>0 ? chegaramIds : m.confirmed;
    if(!m.times){
      return `
        <div class="card">
          <div class="eyebrow">Sorteio de times</div>
          <p class="lead" style="margin:6px 0 12px;">Equilibra os times pela nota (⭐) de cada jogador na posição escolhida hoje. ${chegaramIds.length>0?`Usando os ${chegaramIds.length} que já chegaram.`:'Ninguém marcou chegada ainda — o sorteio vai usar os confirmados.'}</p>
          <button class="btn btn-gold btn-block" data-action="sortear" ${baseIds.length<2?'disabled style="opacity:.5"':''}>⚡ Sortear times</button>
        </div>
      `;
    }
    return `
      ${m.times.map((jogadoresIds,idx)=>{
        const emCampo = idx===m.timeA || idx===m.timeB;
        const cor = corTime(idx);
        const jogadores = jogadoresIds.map(playerById).filter(Boolean);
        return `
        <div class="eyebrow" style="margin-top:14px;color:${cor};">Time ${idx+1} ${emCampo?'· 🟢 Em campo':'· ⏳ Fila'}</div>
        <div class="card">
          ${jogadores.map(pl=>`
            <div class="list-row">
              <div class="jersey" style="width:32px;height:32px;font-size:12px;border-color:${cor};color:${cor};">⭐${matchRating(m,pl)}</div>
              <div class="name">${pl.name}</div>
            </div>`).join('')}
        </div>`;
      }).join('')}
      ${m.status!=='finalizada' ? `<button class="btn btn-ghost btn-block" style="margin-top:10px;" data-action="sortear">🔄 Sortear de novo</button>` : ''}
    `;
  }

  function renderTabAcoes(m,g){
    if(!m.times) return `<div class="empty"><span class="ball">⚖️</span>Sorteie os times primeiro na aba Times.</div>`;
    m.statsJogo = m.statsJogo || {};
    const numA = m.timeA+1, numB = m.timeB+1;
    const corA = corTime(m.timeA), corB = corTime(m.timeB);
    if(m.status==='finalizada'){
      return `
        <div class="card">
          <div class="row" style="margin-bottom:2px;"><div style="flex:1;text-align:center;color:${corA};font-weight:800;">TIME ${numA}</div><div style="flex:1;text-align:center;color:${corB};font-weight:800;">TIME ${numB}</div></div>
          <div class="score-line"><span style="color:${corA};">${m.placar.A}</span><span class="vs">x</span><span style="color:${corB};">${m.placar.B}</span></div>
        </div>
        ${renderStatsBlock(m)}
      `;
    }
    const souAdmin = g.adminId===me;
    m.timer = m.timer || {rodando:false, inicioTs:null, acumuladoMs:0};
    const elapsed = timerElapsedMs(m);
    const jogadoresA = jogadoresDoTime(m,'A').map(playerById).filter(Boolean);
    const jogadoresB = jogadoresDoTime(m,'B').map(playerById).filter(Boolean);
    let assistPicker = '';
    if(souAdmin && ui.pedirAssistencia){
      const {pid, team} = ui.pedirAssistencia;
      const timeArr = jogadoresDoTime(m, team);
      const colegas = timeArr.filter(x=>x!==pid).map(playerById).filter(Boolean);
      assistPicker = `
        <div class="card">
          <div class="eyebrow">⚽ Gol! Quem deu a assistência?</div>
          <div class="chip-row">
            <div class="chip" data-assist="sem">Sem assistência</div>
            ${colegas.map(c=>`<div class="chip" data-assist="${c.id}">${c.name}</div>`).join('')}
          </div>
        </div>`;
    }
    const linhaJogador = (pl, slot) => {
      const initials = pl.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const cor = slot==='A'?corA:corB;
      const expandido = souAdmin && ui.resultadoJogadorId===pl.id;
      return `
        <div class="list-row" ${souAdmin?`data-toggle-resultado="${pl.id}" style="cursor:pointer;"`:''}>
          <div class="jersey" style="width:32px;height:32px;font-size:12px;border-color:${cor};color:${cor};">${initials}</div>
          <div style="flex:1;">
            <div class="name">${pl.name}</div>
            <div class="meta">${matchPos(m,pl)}</div>
          </div>
          ${souAdmin?`<div style="color:var(--ink-dim);">${expandido?'▲':'▼'}</div>`:''}
        </div>
        ${expandido ? renderPainelEventos(m, pl, slot) : ''}`;
    };
    return `
      <div class="card">
        <div class="row" style="margin-bottom:2px;"><div style="flex:1;text-align:center;color:${corA};font-weight:800;">TIME ${numA}</div><div style="flex:1;text-align:center;color:${corB};font-weight:800;">TIME ${numB}</div></div>
        <div class="score-line"><span style="color:${corA};">${m.placar.A}</span><span class="vs">x</span><span style="color:${corB};">${m.placar.B}</span></div>
        <div class="display" style="text-align:center;font-size:34px;color:var(--gold);margin-top:4px;" id="timer-display">${fmtTimer(elapsed)}</div>
        ${souAdmin ? `
          <div class="row" style="gap:10px;margin-top:14px;">
            ${m.timer.rodando
              ? `<button class="btn btn-ghost" style="flex:1;" data-action="pausar-timer">⏸️ Pausar</button>`
              : `<button class="btn btn-gold" style="flex:1;" data-action="iniciar-timer">▶️ ${elapsed>0?'Retomar':'Iniciar'}</button>`}
            <button class="btn btn-danger" style="flex:1;" data-action="finalizar">🛑 Finalizar</button>
          </div>
        ` : `<p class="lead" style="text-align:center;margin:10px 0 0;">Só o administrador controla o cronômetro e os eventos da partida.</p>`}
      </div>
      ${souAdmin && ui.pedirSaidaTime ? renderEscolhaTimeSai(m) : ''}
      ${assistPicker}
      ${souAdmin ? `<p class="lead">Toque num jogador pra registrar o que aconteceu com ele.</p>` : ''}
      <div class="card">
        <div class="team-label" style="color:${corA};">TIME ${numA}</div>
        ${jogadoresA.map(pl=>linhaJogador(pl,'A')).join('')}
        <div class="divider-field"></div>
        <div class="team-label" style="color:${corB};">TIME ${numB}</div>
        ${jogadoresB.map(pl=>linhaJogador(pl,'B')).join('')}
      </div>
    `;
  }
  function renderEscolhaTimeSai(m){
    return `
      <div class="card" style="margin-top:14px;">
        <div class="eyebrow">Qual time sai?</div>
        <p class="lead" style="margin:0 0 10px;">Tem time(s) na fila esperando pra jogar.</p>
        <button class="btn btn-ghost btn-block" style="margin-bottom:8px;" data-sai-time="A">Time ${m.timeA+1} sai</button>
        <button class="btn btn-ghost btn-block" style="margin-bottom:8px;" data-sai-time="B">Time ${m.timeB+1} sai</button>
        <button class="btn btn-danger btn-block" data-sai-time="ambos">Os dois saem</button>
      </div>
    `;
  }
  function renderPainelEventos(m, pl, team){
    const isGoleiro = matchPos(m,pl)==='Goleiro';
    const botoesLinha = [
      {ev:'gol', label:'⚽ Gol'}, {ev:'desarme', label:'🛡️ Desarme'}, {ev:'drible', label:'🌀 Drible'},
      {ev:'faltaCometida', label:'🚫 Falta cometida'}, {ev:'golContra', label:'🔴 Gol contra'},
    ];
    const botoesGoleiro = [
      {ev:'defesa', label:'🧤 Defesa'}, {ev:'defesaDificil', label:'🧤 Defesa difícil'}, {ev:'golSofrido', label:'😬 Gol sofrido'},
      {ev:'falta', label:'🚫 Falta'}, {ev:'penaltiCometido', label:'⚠️ Pênalti cometido'}, {ev:'penaltiDefendido', label:'🙌 Pênalti defendido'},
    ];
    const botoesCartao = [
      {cor:'amarelo', label:'🟨 Amarelo'}, {cor:'azul', label:'🟦 Azul'}, {cor:'vermelho', label:'🟥 Vermelho'},
    ];
    return `
      <div class="card tight" style="margin:6px 0 12px;background:var(--bg2);">
        <div class="chip-row">
          ${(isGoleiro?botoesGoleiro:botoesLinha).map(b=>`<div class="chip" data-evento="${b.ev}" data-pid="${pl.id}" data-team="${team}">${b.label}</div>`).join('')}
        </div>
        <div class="chip-row" style="margin-top:8px;">
          ${botoesCartao.map(b=>`<div class="chip" data-cartao-evento="${b.cor}" data-pid="${pl.id}">${b.label}</div>`).join('')}
        </div>
      </div>
    `;
  }

  function jogadoresElegiveisAvaliacao(m){
    const todos = [...jogadoresDoTime(m,'A'), ...jogadoresDoTime(m,'B')];
    return todos.filter(pid => m.chegadas[pid] !== false);
  }
  function renderTabAvaliacoes(m,g){
    if(m.status!=='finalizada') return `<div class="empty"><span class="ball">⭐</span>As avaliações abrem depois que a partida for finalizada.</div>`;
    const prazo = avaliacaoPrazo(m,g);
    const souAdmin = g.adminId===me;
    if(prazo.expirado){
      return `<div class="card"><div class="empty" style="padding:14px 0;"><span class="ball">⏰</span>O mercado de notas dessa partida encerrou.</div></div>${renderStatsBlock(m)}`;
    }
    m.chegadas = m.chegadas || {};
    const todos = [...jogadoresDoTime(m,'A'), ...jogadoresDoTime(m,'B')];
    let assistPicker = '';
    if(souAdmin && ui.pedirAssistencia){
      const {pid, team} = ui.pedirAssistencia;
      const colegas = jogadoresDoTime(m, team).filter(x=>x!==pid).map(playerById).filter(Boolean);
      assistPicker = `
        <div class="card">
          <div class="eyebrow">⚽ Gol! Quem deu a assistência?</div>
          <div class="chip-row">
            <div class="chip" data-assist="sem">Sem assistência</div>
            ${colegas.map(c=>`<div class="chip" data-assist="${c.id}">${c.name}</div>`).join('')}
          </div>
        </div>`;
    }
    return `
      <div class="eyebrow">🏪 Mercado de Notas</div>
      <p class="lead">Prazo pra avaliar: até ${prazo.limite.toLocaleDateString('pt-BR')} às ${String(prazo.limite.getHours()).padStart(2,'0')}:${String(prazo.limite.getMinutes()).padStart(2,'0')}</p>
      ${souAdmin ? `
        <div class="eyebrow" style="margin-top:14px;">Controle de presença (admin)</div>
        <div class="card">
          <p class="lead" style="margin:0 0 10px;">Desmarque quem não compareceu, pra ele não entrar na avaliação por engano.</p>
          ${todos.map(pid=>{
            const pl = playerById(pid); if(!pl) return '';
            const compareceu = m.chegadas[pid] !== false;
            return `
            <div class="list-row">
              <div class="name" style="flex:1;">${pl.name}</div>
              <button class="btn btn-sm ${compareceu?'btn-gold':'btn-ghost'}" data-toggle-presenca-aval="${pid}">${compareceu?'Compareceu':'Faltou'}</button>
            </div>`;
          }).join('')}
        </div>
        <div class="eyebrow" style="margin-top:14px;">Editar estatísticas (admin)</div>
        <div class="card">
          ${todos.map(pid=>{
            const pl = playerById(pid); if(!pl) return '';
            const team = jogadoresDoTime(m,'A').includes(pid) ? 'A' : 'B';
            const expandido = ui.resultadoJogadorId===pid;
            return `
            <div class="list-row" data-toggle-resultado="${pid}" style="cursor:pointer;">
              <div class="name" style="flex:1;">${pl.name}</div>
              <div style="color:var(--ink-dim);">${expandido?'▲':'▼'}</div>
            </div>
            ${expandido ? renderPainelEventos(m, pl, team) : ''}`;
          }).join('')}
        </div>
      ` : ''}
      ${assistPicker}
      ${renderAvaliacaoBlock(m)}
    `;
  }

  function renderAvaliacaoBlock(m){
    if(!m.times) return '';
    const elegiveis = jogadoresElegiveisAvaliacao(m);
    if(!elegiveis.includes(me)) return '';
    const outros = elegiveis.filter(id=>id!==me);
    const minhasNotas = (m.avaliacoesFeitas && m.avaliacoesFeitas[me]) || {};
    return `
      <div class="card">
        <p class="lead" style="margin:0 0 10px;">De 0 a 10, avalie quem jogou com você hoje. Sua nota entra na média geral de cada jogador.</p>
        ${outros.map(pid=>{
          const pl = playerById(pid); if(!pl) return '';
          const atual = minhasNotas[pid];
          return `
          <div class="list-row">
            <div class="name" style="flex:1;">${pl.name}</div>
            <select data-avaliar="${pid}" style="width:70px;">
              <option value="">–</option>
              ${Array.from({length:11},(_,i)=>i).map(n=>`<option value="${n}" ${atual===n?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>`;
        }).join('')}
        <button class="btn btn-gold btn-block" style="margin-top:10px;" data-action="salvar-avaliacoes" data-mid="${m.id}">Salvar avaliações</button>
      </div>
    `;
  }

  function destaquesDaPelada(m){
    if(!m || !m.times) return null;
    const todos = [...jogadoresDoTime(m,'A'), ...jogadoresDoTime(m,'B')];
    if(!todos.length) return null;
    const statsJogo = m.statsJogo || {};
    const notas = {};
    todos.forEach(pid=>{
      const recebidas = m.avaliacoesFeitas ? Object.values(m.avaliacoesFeitas).map(o=>o[pid]).filter(n=>n!=null) : [];
      notas[pid] = recebidas.length ? recebidas.reduce((a,b)=>a+b,0)/recebidas.length : null;
    });
    const comNota = todos.filter(pid=>notas[pid]!=null);
    const melhorPor = (fn, lista) => { if(!lista.length) return null; return lista.reduce((best,pid)=> fn(pid)>fn(best)?pid:best, lista[0]); };
    const piorPor = (fn, lista) => { if(!lista.length) return null; return lista.reduce((w,pid)=> fn(pid)<fn(w)?pid:w, lista[0]); };
    const valGol = pid=> m.golsPorJogador[pid]||0;
    const valAssist = pid=> (statsJogo[pid]&&statsJogo[pid].assistencia)||0;
    const valDesarme = pid=> (statsJogo[pid]&&statsJogo[pid].desarme)||0;
    const valDefDificil = pid=> (statsJogo[pid]&&statsJogo[pid].defesaDificil)||0;
    const valFalha = pid=> ((statsJogo[pid]&&statsJogo[pid].faltaCometida)||0) + ((statsJogo[pid]&&statsJogo[pid].falta)||0);
    const d = {
      craque: comNota.length ? melhorPor(pid=>notas[pid], comNota) : null,
      pereba: comNota.length ? piorPor(pid=>notas[pid], comNota) : null,
      artilheiro: valGol(melhorPor(valGol, todos))>0 ? melhorPor(valGol, todos) : null,
      garcom: valAssist(melhorPor(valAssist, todos))>0 ? melhorPor(valAssist, todos) : null,
      xerifao: valDesarme(melhorPor(valDesarme, todos))>0 ? melhorPor(valDesarme, todos) : null,
      paredao: valDefDificil(melhorPor(valDefDificil, todos))>0 ? melhorPor(valDefDificil, todos) : null,
      bolaMurcha: valFalha(melhorPor(valFalha, todos))>0 ? melhorPor(valFalha, todos) : null,
    };
    d.valores = { artilheiro: valGol, garcom: valAssist, xerifao: valDesarme, paredao: valDefDificil, bolaMurcha: valFalha, craque: pid=>notas[pid], pereba: pid=>notas[pid] };
    return d;
  }
  function renderDestaques(m){
    const d = destaquesDaPelada(m);
    if(!d) return '';
    const categorias = [
      {key:'craque', icon:'🏆', label:'Craque', fmt:v=>v.toFixed(1)},
      {key:'artilheiro', icon:'⚽', label:'Artilheiro', fmt:v=>v+' gols'},
      {key:'garcom', icon:'🅰️', label:'Garçom', fmt:v=>v+' assist.'},
      {key:'xerifao', icon:'🛡️', label:'Xerifão', fmt:v=>v+' desarmes'},
      {key:'paredao', icon:'🧤', label:'Paredão', fmt:v=>v+' def. difíceis'},
      {key:'bolaMurcha', icon:'😅', label:'Bola Murcha', fmt:v=>v+' falhas'},
      {key:'pereba', icon:'📉', label:'Pereba', fmt:v=>v.toFixed(1)},
    ].filter(c=>d[c.key]);
    if(!categorias.length) return '';
    return `
      <div class="eyebrow" style="margin-top:16px;">Destaques da pelada</div>
      <div class="row" style="flex-wrap:wrap;gap:10px;">
        ${categorias.map(c=>{

          const valor = d.valores[c.key](pid);
          return `

            <div style="font-size:20px;">${c.icon}</div>
            <div class="meta" style="text-transform:uppercase;letter-spacing:.5px;">${c.label}</div>

        }).join('')}

    `;
  }

  function statsExtrasRanking(playerId, gids){
    let amarelo=0, azul=0, vermelho=0, presenca=0, defesaDificil=0;
    data.matches.forEach(m=>{
      if(!gids.includes(m.groupId)) return;
      if(m.confirmed.includes(playerId)) presenca++;
      if(m.status==='finalizada'){
        const c = (m.cartoes && m.cartoes[playerId]) || {};
        amarelo += c.amarelo||0; azul += c.azul||0; vermelho += c.vermelho||0;
        const sj = (m.statsJogo && m.statsJogo[playerId]) || {};
        defesaDificil += sj.defesaDificil||0;
      }
    });
    return {amarelo, azul, vermelho, presenca, defesaDificil};
  }
  function valorRanking(pl, mode, gids){
    if(mode==='gols') return pl.stats.gols;
    if(mode==='assistencias') return pl.stats.assistencias;
    if(mode==='partidas') return pl.stats.jogos;
    if(mode==='vitorias') return pl.stats.vitorias;
    return statsExtrasRanking(pl.id, gids)[mode] || 0;
  }
  function renderRanking(){
    const gids = myGroups().map(g=>g.id);
    const ids = new Set();
    gids.forEach(gid=> groupById(gid).memberIds.forEach(id=>ids.add(id)));
    let players = [...ids].map(playerById).filter(Boolean);
    let mode = ui.rankMode || 'gols';
    players.sort((a,b)=> valorRanking(b,mode,gids) - valorRanking(a,mode,gids));
    const modoAtual = RANKING_MODOS.find(m=>m.key===mode);
    return `

  function fmtDate(iso){ const [y,m,d] = iso.split('-'); return `${d}/${m}`; }
  function calcAge(dob){
    if(!dob) return null;
    const d = new Date(dob+'T00:00:00'); const now = new Date();
    let age = now.getFullYear() - d.getFullYear();
    const monthDiff = now.getMonth() - d.getMonth();
    if(monthDiff < 0 || (monthDiff===0 && now.getDate() < d.getDate())) age--;
    return age;
  }

  function applyMatchResultStats(m){
    const vencedor = m.placar.A>m.placar.B ? 'A' : (m.placar.B>m.placar.A ? 'B' : 'empate');
    const timeA = jogadoresDoTime(m,'A'), timeB = jogadoresDoTime(m,'B');
    [...timeA, ...timeB].forEach(pid=>{
      const pl = playerById(pid); if(!pl) return;
      pl.stats.jogos += 1;
      pl.stats.gols += (m.golsPorJogador[pid]||0);
      const slot = timeA.includes(pid) ? 'A':'B';
      if(vencedor==='empate') pl.stats.empates += 1;
      else if(vencedor===slot) pl.stats.vitorias += 1;
      else pl.stats.derrotas += 1;
    });
  }

  function randStars(mainPos, secPos){
    const nested = {};
    CAMPO_TIPOS.forEach(tipo=>{

      posicoesParaCampo(tipo).forEach(pos=>{

    m1.times = timesM1; m1.timeA = 0; m1.timeB = 1; m1.filaIdx = timesM1.length>2 ? timesM1.slice(2).map((_,i)=>i+2) : [];
