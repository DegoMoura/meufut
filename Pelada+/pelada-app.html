      const salvarConvidadoBtn = document.querySelector('[data-action="salvar-convidado"]');
      if(salvarConvidadoBtn) salvarConvidadoBtn.onclick = async ()=>{
        if(!d.nome.trim() || !d.posicao) return;
        const m = matchById(ui.matchId); const g = groupById(m.groupId);
        const a = associacaoAtual(); const tipo = a ? a.campoTipo : 'Campo';
        const notaBase = Math.min(10, Math.max(1, d.nivel));
        const stars = Object.fromEntries(CAMPO_TIPOS.map(t=>[t, Object.fromEntries(posicoesParaCampo(t).map(pos=>[pos, (pos===d.posicao && t===tipo) ? notaBase : 5]))]));
        const pl = { id: uid(), name:d.nome.trim(), usuario:null, senha:null, googleConnected:false,
          whatsapp:'', nascimento:'', estado:'', cidade:'', genero:'', estadoCivil:'', filhos:'',
          posicaoPrincipal:{[tipo]:d.posicao}, pe:'Direito', altura:'', peso:'', pe_numero:'', timeCoracao:'',
          starsByPosition: stars, foto:null, convidado:true,
          stats:{jogos:0,gols:0,assistencias:0,vitorias:0,empates:0,derrotas:0,cartoes:0} };
        data.players.push(pl);
        m.positionByPlayer[pl.id] = d.posicao;
        m.confirmadoEm = m.confirmadoEm || {};
        m.confirmadoEm[pl.id] = new Date().toISOString();
        if(!m.confirmed.includes(pl.id)) m.confirmed.push(pl.id);
        logAtividade(g, `adicionou ${pl.name} como convidado`);
        ui.modal=null; ui.draftConvidado=null;
        await saveData(); showToast(`${pl.name} adicionado como convidado!`); render();
      };
    }

    // ---- Alterar pelada ----
    if(ui.modal==='alterar-pelada' && ui.draftAlterarPelada){
      const d = ui.draftAlterarPelada;
      const byId = id=>document.getElementById(id);
      if(byId('alt-date')) byId('alt-date').oninput = e=>{ d.date = e.target.value; };
      if(byId('alt-hora-ini')) byId('alt-hora-ini').oninput = e=>{ d.horaInicio = e.target.value; };
      if(byId('alt-hora-fim')) byId('alt-hora-fim').oninput = e=>{ d.horaFim = e.target.value; };
      if(byId('alt-local')) byId('alt-local').oninput = e=>{ d.local = e.target.value; };
      if(byId('alt-limite-data')) byId('alt-limite-data').oninput = e=>{ d.limiteData = e.target.value; };
      if(byId('alt-limite-hora')) byId('alt-limite-hora').oninput = e=>{ d.limiteHora = e.target.value; };
      const salvarAlterarBtn = document.querySelector('[data-action="salvar-alterar-pelada"]');
      if(salvarAlterarBtn) salvarAlterarBtn.onclick = async ()=>{
        const m = matchById(ui.matchId); const g = groupById(m.groupId);
        m.date = d.date; m.time = d.horaInicio; m.horaTermino = d.horaFim; m.local = d.local.trim() || m.local;
        m.confirmFimData = d.limiteData; m.confirmFimHora = d.limiteHora;
        logAtividade(g, 'alterou os dados da pelada');
        ui.modal=null; ui.draftAlterarPelada=null;
        await saveData(); showToast('Pelada atualizada!'); render();
      };
    }

    function contarGoleirosConfirmados(m){
      return m.confirmed.filter(pid => (m.positionByPlayer[pid]||'')==='Goleiro').length;
    }
    function contarLinhaConfirmados(m){
      return m.confirmed.filter(pid => (m.positionByPlayer[pid]||'')!=='Goleiro').length;
    }
    function tentarAbrirVagaPrioridade(m, g, souDiarista){
      if(souDiarista) return false;
      const diaristas = g.diaristas || [];
      const alvo = m.confirmed.find(pid => diaristas.includes(pid) && (m.positionByPlayer[pid]||'')!=='Goleiro');
      if(!alvo) return false;
      m.confirmed = m.confirmed.filter(id=>id!==alvo);
      m.waitlist.push(alvo);
      return true;
    }
    document.querySelectorAll('[data-confirm]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId); const g = groupById(m.groupId);
      const status = el.dataset.confirm;
      m.confirmed = m.confirmed.filter(id=>id!==me);
      m.maybe = m.maybe.filter(id=>id!==me);
      m.declined = m.declined.filter(id=>id!==me);
      m.waitlist = m.waitlist.filter(id=>id!==me);
      m.confirmadoEm = m.confirmadoEm || {};
      if(status==='vou'){
        if(!m.positionByPlayer[me]) m.positionByPlayer[me] = posicaoPrincipalPara(myPlayer(), associacaoAtual()?associacaoAtual().campoTipo:'Campo');
        const maxLinha = m.maxJogadores || g.maxPlayers;
        const maxGK = m.maxGoleiros!=null ? m.maxGoleiros : 99;
        const souGoleiroHoje = m.positionByPlayer[me]==='Goleiro';
        m.confirmadoEm[me] = new Date().toISOString();
        if(souGoleiroHoje){
          if(contarGoleirosConfirmados(m) < maxGK) m.confirmed.push(me);
          else { m.waitlist.push(me); showToast('Limite de goleiros já atingido — você entrou na lista de espera.'); }
        } else {
          const souDiarista = (g.diaristas||[]).includes(me);
          if(contarLinhaConfirmados(m) < maxLinha){
            m.confirmed.push(me);
          } else if(tentarAbrirVagaPrioridade(m, g, souDiarista)){
            m.confirmed.push(me);
            showToast('Vaga liberada! Mensalistas têm prioridade sobre diaristas — um diarista foi pra lista de espera.');
          } else {
            m.waitlist.push(me);
            if(souDiarista) showToast('Vagas cheias — você entrou na lista de espera (é diarista).');
          }
        }
      } else { m.declined.push(me); }
      await saveData(); render();
    });

    document.querySelectorAll('[data-admin-confirm]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId); const g = groupById(m.groupId);
      if(g.adminId!==me) return;
      const pid = el.dataset.adminConfirm; const status = el.dataset.status;
      m.confirmed = m.confirmed.filter(id=>id!==pid);
      m.declined = m.declined.filter(id=>id!==pid);
      m.waitlist = m.waitlist.filter(id=>id!==pid);
      m.confirmadoEm = m.confirmadoEm || {};
      if(status==='vou'){
        if(!m.positionByPlayer[pid]) m.positionByPlayer[pid] = posicaoPrincipalPara(playerById(pid), associacaoAtual()?associacaoAtual().campoTipo:'Campo');
        const maxLinha = m.maxJogadores || g.maxPlayers;
        const maxGK = m.maxGoleiros!=null ? m.maxGoleiros : 99;
        const ehGoleiroHoje = m.positionByPlayer[pid]==='Goleiro';
        m.confirmadoEm[pid] = new Date().toISOString();
        if(ehGoleiroHoje){
          if(contarGoleirosConfirmados(m) < maxGK) m.confirmed.push(pid); else m.waitlist.push(pid);
        } else {
          const ehDiarista = (g.diaristas||[]).includes(pid);
          if(contarLinhaConfirmados(m) < maxLinha){
            m.confirmed.push(pid);
          } else if(tentarAbrirVagaPrioridade(m, g, ehDiarista)){
            m.confirmed.push(pid);
          } else {
            m.waitlist.push(pid);
          }
        }
      } else { m.declined.push(pid); }
      await saveData(); showToast('Presença atualizada pelo admin.'); render();
    });

    document.querySelectorAll('[data-pick-pos]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      m.positionByPlayer[me] = el.dataset.pickPos;
      await saveData(); showToast('Posição de hoje atualizada!'); render();
    });

    document.querySelectorAll('[data-toggle-chegada]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      const pid = el.dataset.toggleChegada;
      m.chegadas = m.chegadas || {};
      m.chegadas[pid] = !m.chegadas[pid];
      await saveData(); render();
    });

    document.querySelectorAll('[data-toggle-presenca-aval]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      const pid = el.dataset.togglePresencaAval;
      m.chegadas = m.chegadas || {};
      m.chegadas[pid] = !(m.chegadas[pid] !== false);
      await saveData(); showToast('Presença atualizada.'); render();
    });

    const sortearBtn = document.querySelector('[data-action="sortear"]');
    if(sortearBtn) sortearBtn.onclick = async ()=>{
      const m = matchById(ui.matchId); const g = groupById(m.groupId);
      m.chegadas = m.chegadas || {};
      const chegaramIds = m.confirmed.filter(id=>m.chegadas[id]);
      const baseIds = chegaramIds.length>0 ? chegaramIds : m.confirmed;
      const linhaCap = m.maxJogadores || g.maxPlayers;
      const golCap = m.maxGoleiros || 0;
      const tamanhoAlvo = golCap>0 ? Math.max(2, Math.round(linhaCap/golCap)+1) : Math.max(2, Math.floor(linhaCap/2));
      const tamanho = Math.min(tamanhoAlvo, Math.floor(baseIds.length/2) || 1);
      const { times, reservas } = sortearComFila(baseIds, m, tamanho);
      m.times = times;
      m.timeA = 0; m.timeB = times.length>1 ? 1 : null;
      m.filaIdx = times.length>2 ? times.slice(2).map((_,i)=>i+2) : [];
      m.placar = {A:0,B:0};
      if(reservas.length) showToast(`Times sorteados! ${reservas.length} de reserva.`); else showToast('Times sorteados!');
      m.status = 'sorteada';
      ui.matchSubTab = 'acoes';
      logAtividade(g, 'sorteou os times');
      await saveData(); render();
    };

    document.querySelectorAll('[data-toggle-resultado]').forEach(el=> el.onclick = ()=>{
      const pid = el.dataset.toggleResultado;
      ui.resultadoJogadorId = ui.resultadoJogadorId===pid ? null : pid;
      render();
    });

    document.querySelectorAll('[data-evento]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      const pid = el.dataset.pid; const ev = el.dataset.evento; const team = el.dataset.team;
      m.statsJogo = m.statsJogo || {};
      m.statsJogo[pid] = m.statsJogo[pid] || {};
      m.statsJogo[pid][ev] = (m.statsJogo[pid][ev]||0)+1;
      if(ev==='gol'){
        m.placar[team] += 1;
        m.golsPorJogador[pid] = (m.golsPorJogador[pid]||0)+1;
        ui.pedirAssistencia = {pid, team};
        ui.resultadoJogadorId = null;
        await saveData(); render();
        return;
      }
      if(ev==='golSofrido' || ev==='golContra'){
        const adversario = team==='A' ? 'B' : 'A';
        m.placar[adversario] += 1;
      }
      await saveData(); showToast('Registrado!'); render();
    });

    document.querySelectorAll('[data-assist]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      const val = el.dataset.assist;
      if(val!=='sem'){
        m.statsJogo = m.statsJogo || {};
        m.statsJogo[val] = m.statsJogo[val] || {};
        m.statsJogo[val].assistencia = (m.statsJogo[val].assistencia||0)+1;
      }
      ui.pedirAssistencia = null;
      await saveData(); render();
    });

    document.querySelectorAll('[data-cartao-evento]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      const pid = el.dataset.pid; const cor = el.dataset.cartaoEvento;
      m.cartoes = m.cartoes || {};
      m.cartoes[pid] = m.cartoes[pid] || {amarelo:0,vermelho:0,azul:0};
      m.cartoes[pid][cor] += 1;
      await saveData(); showToast('Cartão registrado'); render();
    });

    const iniciarTimerBtn = document.querySelector('[data-action="iniciar-timer"]');
    if(iniciarTimerBtn) iniciarTimerBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      m.timer = m.timer || {rodando:false, inicioTs:null, acumuladoMs:0};
      m.timer.rodando = true; m.timer.inicioTs = Date.now();
      await saveData(); render();
    };
    const pausarTimerBtn = document.querySelector('[data-action="pausar-timer"]');
    if(pausarTimerBtn) pausarTimerBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      m.timer.acumuladoMs = timerElapsedMs(m);
      m.timer.rodando = false; m.timer.inicioTs = null;
      await saveData(); render();
    };

    const salvarAvalBtn = document.querySelector('[data-action="salvar-avaliacoes"]');
    if(salvarAvalBtn) salvarAvalBtn.onclick = async ()=>{
      const m = matchById(salvarAvalBtn.dataset.mid);
      const obj = {};
      document.querySelectorAll('[data-avaliar]').forEach(sel=>{
        if(sel.value!=='') obj[sel.dataset.avaliar] = parseInt(sel.value);
      });
      delete obj[me]; // segurança: nunca aceitar autoavaliação
      m.avaliacoesFeitas = m.avaliacoesFeitas || {};
      m.avaliacoesFeitas[me] = obj;
      await saveData(); showToast('Avaliações salvas!'); render();
    };

    const finalizarBtn = document.querySelector('[data-action="finalizar"]');
    if(finalizarBtn) finalizarBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      if(m.timer && m.timer.rodando){ m.timer.acumuladoMs = timerElapsedMs(m); m.timer.rodando=false; m.timer.inicioTs=null; }
      if((m.filaIdx||[]).length>0){
        ui.pedirSaidaTime = true; await saveData(); render();
        return;
      }
      m.status = 'finalizada';
      applyMatchResultStats(m);
      logAtividade(groupById(m.groupId), 'finalizou a partida');
      await saveData(); showToast('Partida finalizada!'); render();
    };

    document.querySelectorAll('[data-sai-time]').forEach(el=> el.onclick = async ()=>{
      const escolha = el.dataset.saiTime;
      const mAntiga = matchById(ui.matchId);
      mAntiga.status = 'finalizada';
      applyMatchResultStats(mAntiga);
      let fila = (mAntiga.filaIdx||[]).slice();
      let novoTimeA, novoTimeB;
      if(escolha==='ambos'){
        novoTimeA = fila.shift(); novoTimeB = fila.shift();
        fila.push(mAntiga.timeA, mAntiga.timeB);
      } else if(escolha==='A'){
        novoTimeA = fila.shift(); novoTimeB = mAntiga.timeB;
        fila.push(mAntiga.timeA);
      } else {
        novoTimeB = fila.shift(); novoTimeA = mAntiga.timeA;
        fila.push(mAntiga.timeB);
      }
      const nova = { id: uid(), groupId: mAntiga.groupId, date: mAntiga.date, time: mAntiga.time, local: mAntiga.local, valor: mAntiga.valor,
        confirmed:[...mAntiga.confirmed], maybe:[], declined:[], waitlist:[], status: (novoTimeA!=null&&novoTimeB!=null)?'sorteada':'aberta',
        positionByPlayer:{...mAntiga.positionByPlayer},
        confirmInicioData:mAntiga.confirmInicioData, confirmInicioHora:mAntiga.confirmInicioHora,
        confirmFimData:mAntiga.confirmFimData, confirmFimHora:mAntiga.confirmFimHora,
        times: mAntiga.times, timeA: novoTimeA, timeB: novoTimeB, filaIdx: fila,
        placar:{A:0,B:0}, golsPorJogador:{}, pagamentos:{}, cartoes:{}, avaliacoesFeitas:{},
        chegadas:{...mAntiga.chegadas}, statsJogo:{}, timer:{rodando:false,inicioTs:null,acumuladoMs:0} };
      data.matches.push(nova);
      ui.matchId = nova.id; ui.pedirSaidaTime=false; ui.matchTab='partida'; ui.matchSubTab='acoes';
      await saveData(); showToast('Times trocados! Nova partida pronta.'); render();
    });

    const logoutBtn = document.querySelector('[data-action="logout"]');
    if(logoutBtn) logoutBtn.onclick = async ()=>{
      ui.loginPhone='';
      try{ await signOut(auth); }catch(e){}
    };

    ensureTimerInterval();
  }

  function ensureTimerInterval(){
    if(window.__peladaTimerInt){ clearInterval(window.__peladaTimerInt); window.__peladaTimerInt=null; }
    if(view==='partida-detalhe' && ui.matchTab==='partida' && (ui.matchSubTab||'chegadas')==='acoes'){
      const m = matchById(ui.matchId);
      if(m && m.timer && m.timer.rodando){
        window.__peladaTimerInt = setInterval(()=>{
          const el = document.getElementById('timer-display');
          if(el){ el.textContent = fmtTimer(timerElapsedMs(m)); } else { clearInterval(window.__peladaTimerInt); }
        }, 1000);
      }
    }
  }

  loadAll();
})();
</script>
</body>
</html>
