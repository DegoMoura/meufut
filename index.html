  async function gerarDemo(){
    const p = myPlayer();
    if(!associacaoId){
      const a = { id: uid(), name:'Associação Demo', campoTipo:'Society', categoria:'Misto', endereco:'Ilhéus, BA',
        diasSemana:['Quinta-feira'], horaInicio:'20:00', horaTermino:'21:00', jogadoresLinha:7, prazoAvaliacaoHoras:6, code: genCode(), adminId:me, memberIds:[me] };
      data.associacoes.push(a);
      associacaoId = a.id;
      await saveMe();
    }
    const assocAtual = associacaoAtual();
    const tipoCampo = assocAtual ? assocAtual.campoTipo : 'Society';
    const posSet = posicoesParaCampo(tipoCampo);
    const g = { id: uid(), associacaoId, name:'Pelada Demo — Quinta', tipo:'Society', diaPadrao:'Quinta-feira', horarioPadrao:'20:00',
      local:'Quadra Central', maxPlayers:28, valor:20, adminId: me, memberIds:[me], diaristas:[] };

    // --- Mensalistas: membros fixos do Fut (nem todos vão confirmar) ---
    const nomesMensalistas = NOMES_DEMO.slice(0,18);
    const mensalistas = nomesMensalistas.map((nome,i)=>{
      const mainPos = i<2 ? 'Goleiro' : pick(posSet.filter(pos=>pos!=='Goleiro')); // só 2 goleiros fixos: o resto da vaga de goleiro vem de convidado
      let secPos = pick(posSet); while(secPos===mainPos) secPos = pick(posSet);
      return { id: uid(), name: nome, usuario: 'demo'+i, senha:'demo', googleConnected:false, whatsapp:'(11) 9'+String(1000+i).padStart(4,'0')+'-0000',
        nascimento:'1996-01-01', estado:'BA', cidade:'Ilhéus', genero:'Masculino', estadoCivil:'Solteiro', filhos:'Não',
        altura:'', peso:'', pe_numero:'', timeCoracao:'', posicao: mainPos, pe: pick(['Direito','Esquerdo','Ambidestro']),
        starsByPosition: randStars(mainPos, secPos), foto:null,
        stats:{ jogos:0, gols:0, assistencias:0, vitorias:0, empates:0, derrotas:0, cartoes:0 } };
    });
    data.players.push(...mensalistas);
    g.memberIds.push(...mensalistas.map(f=>f.id));
    g.diaristas.push(mensalistas[5].id, mensalistas[6].id, mensalistas[7].id); // alguns diaristas, pra testar a distinção
    data.groups.push(g);

    const mensalistaIds = [me, ...mensalistas.map(f=>f.id)]; // 19 mensalistas, 2 goleiros garantidos
    const posByPlayerMensalista = {};
    mensalistaIds.forEach(id=>{ posByPlayerMensalista[id] = posicaoPrincipalPara(playerById(id), tipoCampo); });

    // --- Partida 1: já finalizada (histórico), só com os mensalistas — popula ranking e estatísticas ---
    const ontem = new Date(); ontem.setDate(ontem.getDate()-6);
    const m1 = { id: uid(), groupId:g.id, date: ontem.toISOString().slice(0,10), time:'20:00', local:g.local, valor:g.valor,
      confirmed:[...mensalistaIds], maybe:[], declined:[], waitlist:[], status:'sorteada',
      positionByPlayer:{...posByPlayerMensalista}, chegadas:{}, statsJogo:{}, timer:{rodando:false,inicioTs:null,acumuladoMs:0},
      placar:{A:0,B:0}, golsPorJogador:{}, pagamentos:{}, cartoes:{}, avaliacoesFeitas:{} };
    const { times: timesM1 } = sortearComFila(mensalistaIds, m1, Math.floor(mensalistaIds.length/2));
    m1.times = timesM1; m1.timeA = 0; m1.timeB = 1; m1.filaIdx = timesM1.length>2 ? timesM1.slice(2).map((_,i)=>i+2) : [];
    const golsA = randInt(2,6), golsB = randInt(2,5);
    for(let i=0;i<golsA;i++){ const s=pick(m1.times[0]); m1.golsPorJogador[s]=(m1.golsPorJogador[s]||0)+1; }
    for(let i=0;i<golsB;i++){ const s=pick(m1.times[1]); m1.golsPorJogador[s]=(m1.golsPorJogador[s]||0)+1; }
    m1.placar = {A:golsA, B:golsB};
    m1.status = 'finalizada';
    mensalistaIds.forEach(id=>{ if(Math.random()>0.25) m1.pagamentos[id]=true; });
    mensalistaIds.forEach(raterId=>{
      const notas = {};
      mensalistaIds.filter(id=>id!==raterId).forEach(targetId=>{ notas[targetId] = randInt(6,10); });
      m1.avaliacoesFeitas[raterId] = notas;
    });
    applyMatchResultStats(m1);
    data.matches.push(m1);

    // --- Partida 2: a de hoje — simula confirmações reais e depois convidados até fechar 28 jogadores / 4 goleiros ---
    const sabado = new Date(); sabado.setDate(sabado.getDate() + ((6 - sabado.getDay() + 7) % 7 || 7));
    const m2 = { id: uid(), groupId:g.id, date: sabado.toISOString().slice(0,10), time:'16:00', local:g.local, valor:g.valor,
      confirmed:[], maybe:[], declined:[], waitlist:[], status:'aberta',
      positionByPlayer:{}, confirmadoEm:{}, chegadas:{}, statsJogo:{}, timer:{rodando:false,inicioTs:null,acumuladoMs:0},
      placar:{A:0,B:0}, golsPorJogador:{}, pagamentos:{}, cartoes:{}, avaliacoesFeitas:{} };

    // a maioria dos mensalistas confirma; alguns ficam de talvez ou não vão dar
    const naoConfirmam = mensalistas.slice(-4);
    const talvez = naoConfirmam.slice(0,2), declinam = naoConfirmam.slice(2);
    mensalistaIds.forEach(id=>{
      if(talvez.some(f=>f.id===id)){ m2.maybe.push(id); return; }
      if(declinam.some(f=>f.id===id)){ m2.declined.push(id); return; }
      m2.confirmed.push(id);
      m2.positionByPlayer[id] = posByPlayerMensalista[id];
      m2.confirmadoEm[id] = new Date(Date.now() - randInt(1,48)*3600*1000).toISOString();
    });
    logAtividade(g, `${talvez.length} jogador(es) marcaram talvez e ${declinam.length} não vão poder ir`);

    // faltam vagas e goleiros pro fechamento: admin adiciona convidados (mesmo fluxo de "Adicionar convidado")
    const golsConfirmados = mensalistaIds.filter(id=> m2.confirmed.includes(id) && posByPlayerMensalista[id]==='Goleiro').length;
    const vagasRestantes = 28 - m2.confirmed.length;
    const goleirosNecessarios = Math.max(0, 4 - golsConfirmados);
    const nomesConvidados = NOMES_DEMO.slice(18, 18+vagasRestantes);
    const convidados = nomesConvidados.map((nome,i)=>{
      const querGoleiro = i < goleirosNecessarios;
      const pos = querGoleiro ? 'Goleiro' : pick(posSet.filter(x=>x!=='Goleiro'));
      const notaBase = randInt(5,9);
      const stars = Object.fromEntries(CAMPO_TIPOS.map(t=>[t, Object.fromEntries(posicoesParaCampo(t).map(ps=>[ps, (ps===pos && t===tipoCampo) ? notaBase : 5]))]));
      return { id: uid(), name: nome, usuario:null, senha:null, googleConnected:false,
        whatsapp:'', nascimento:'', estado:'', cidade:'', genero:'', estadoCivil:'', filhos:'',
        posicaoPrincipal:{[tipoCampo]:pos}, pe:'Direito', altura:'', peso:'', pe_numero:'', timeCoracao:'',
        starsByPosition: stars, foto:null, convidado:true,
        stats:{jogos:0,gols:0,assistencias:0,vitorias:0,empates:0,derrotas:0,cartoes:0} };
    });
    data.players.push(...convidados);
    convidados.forEach(c=>{
      m2.confirmed.push(c.id);
      m2.positionByPlayer[c.id] = c.posicaoPrincipal[tipoCampo];
      m2.confirmadoEm[c.id] = new Date(Date.now() - randInt(1,6)*3600*1000).toISOString();
    });
    if(convidados.length) logAtividade(g, `adicionou ${convidados.length} convidado(s) como convidado pra completar a pelada`);

    // chegadas: a maioria já chegou (ordem de chegada numerada), um punhado só confirmou e ainda não chegou
    const idsConfirmados = m2.confirmed.slice();
    const aindaNaoChegaram = idsConfirmados.slice(-3);
    idsConfirmados.forEach((id,i)=>{
      if(aindaNaoChegaram.includes(id)) return;
      m2.chegadas[id] = Date.now() - (idsConfirmados.length-i)*60000;
    });

    m2.status = 'sorteada';
    const { times: times4 } = sortearComFila(m2.confirmed, m2, 7);
    m2.times = times4; m2.timeA = 0; m2.timeB = 1; m2.filaIdx = times4.length>2 ? times4.slice(2).map((_,i)=>i+2) : [];
    data.matches.push(m2);

    await saveData();
    ui.groupId = g.id; ui.matchId = m2.id; view = 'partida-detalhe'; ui.matchTab = 'partida'; ui.matchSubTab = 'acoes';
    showToast(`Demonstração criada! ${m2.confirmed.length-convidados.length} mensalistas confirmaram, ${talvez.length} de talvez, ${declinam.length} não vão — e ${convidados.length} convidados completaram os ${m2.confirmed.length} jogadores (4 goleiros, 4 times prontos).`);
    render();
  }

      return m.confirmed.filter(pid => (m.positionByPlayer[pid]||'')!=='Goleiro').length;
    }
    function tentarAbrirVagaPrioridade(m, g, souDiarista){
      if(souDiarista) return false;
      const diaristas = g.diaristas || [];
      const alvo = m.confirmed.find(pid => diaristas.includes(pid) && (m.positionByPlayer[pid]||'')!=='Goleiro');
      if(!alvo) return false;
      m.confirmed = m.confirmed.filter(id=>id!==alvo);
      m.waitlist.push(alvo);
      return true;
    }

      m.declined = m.declined.filter(id=>id!==me);
      m.waitlist = m.waitlist.filter(id=>id!==me);
      m.confirmadoEm = m.confirmadoEm || {};
      if(status==='vou'){
        if(!m.positionByPlayer[me]) m.positionByPlayer[me] = posicaoPrincipalPara(myPlayer(), associacaoAtual()?associacaoAtual().campoTipo:'Campo');
        const maxLinha = m.maxJogadores || g.maxPlayers;
        const maxGK = m.maxGoleiros!=null ? m.maxGoleiros : 99;
        const souGoleiroHoje = m.positionByPlayer[me]==='Goleiro';
        m.confirmadoEm[me] = new Date().toISOString();
        if(souGoleiroHoje){
          if(contarGoleirosConfirmados(m) < maxGK) m.confirmed.push(me);

        } else {

      const timeIdxSaiu = sub.team==='A' ? m.timeA : m.timeB;
      m.times.forEach(roster=>{ const i = roster.indexOf(entrouId); if(i>=0) roster.splice(i,1); });
      const rosterSaiu = m.times[timeIdxSaiu];
      const i = rosterSaiu.indexOf(sub.saiuId);
      if(i>=0) rosterSaiu[i] = entrouId; else rosterSaiu.push(entrouId);
      if(sub.tipo==='substituicao'){
        m.substituidos = m.substituidos || [];
        m.substituidos.push({pid: sub.saiuId, team: sub.team});
      }
      const nomeSaiu = playerById(sub.saiuId)?.name || '';
      const nomeEntrou = playerById(entrouId)?.name || '';
      logAtividade(g, sub.tipo==='substituicao' ? `substituiu ${nomeSaiu} por ${nomeEntrou}` : `trocou ${nomeSaiu} por ${nomeEntrou} (correção, sem crédito pra quem saiu)`);
      logEvento(m, { nome: nomeEntrou, label: sub.tipo==='substituicao' ? '🔄 Substituição' : '↔️ Troca', detalhe: `entrou no lugar de ${nomeSaiu}`, tipo:'substituicao' });
      ui.substituicaoPendente = null; ui.resultadoJogadorId = null;
      await saveData(); showToast(sub.tipo==='substituicao' ? 'Substituição feita!' : 'Jogador trocado!'); render();
    });

    document.querySelectorAll('[data-cartao-evento]').forEach(el=> el.onclick = async ()=>{
      const m = matchById(ui.matchId);
      const pid = el.dataset.pid; const cor = el.dataset.cartaoEvento; const label = el.dataset.eventoLabel || cor;
      const pl = playerById(pid);
      m.cartoes = m.cartoes || {};
      m.cartoes[pid] = m.cartoes[pid] || {amarelo:0,vermelho:0,azul:0};
      m.cartoes[pid][cor] += 1;
      logEvento(m, { nome: pl.name, label: `Cartão ${label}`, pid, cor, tipo:'cartao' });
      await saveData(); showToast('Cartão registrado'); render();
    });

    document.querySelectorAll('[data-remover-evento]').forEach(el=> el.onclick = ()=>{
      const m = matchById(ui.matchId);
      const idx = parseInt(el.dataset.removerEvento);
      const ev = (m.eventos||[])[idx];
      if(!ev) return;
      abrirConfirmacao('🗑️ Remover evento?', 'Isso desfaz a estatística registrada com ele.', async ()=>{
        removerEventoDaPartida(ui.matchId, idx);
      });
    });
    async function removerEventoDaPartida(matchId, idx){
      const m = matchById(matchId);
      const ev = m && (m.eventos||[])[idx];
      if(!ev) return;
      m.statsJogo = m.statsJogo || {};
      if(ev.tipo==='evento' && ev.pid){
        m.statsJogo[ev.pid] = m.statsJogo[ev.pid] || {};
        if(ev.ev){
          m.statsJogo[ev.pid][ev.ev] = Math.max(0, (m.statsJogo[ev.pid][ev.ev]||0)-1);
        }
        if(ev.ev==='gol'){
          m.placar[ev.team] = Math.max(0, (m.placar[ev.team]||0)-1);
          m.golsPorJogador[ev.pid] = Math.max(0, (m.golsPorJogador[ev.pid]||0)-1);
          if(ev.assistPid){
            m.statsJogo[ev.assistPid] = m.statsJogo[ev.assistPid] || {};
            m.statsJogo[ev.assistPid].assistencia = Math.max(0, (m.statsJogo[ev.assistPid].assistencia||0)-1);
          }
        } else if(ev.ev==='golSofrido' || ev.ev==='golContra'){
          const adversario = ev.team==='A' ? 'B' : 'A';
          m.placar[adversario] = Math.max(0, (m.placar[adversario]||0)-1);
        }
      } else if(ev.tipo==='falha' && ev.pid){
        m.statsJogo[ev.pid] = m.statsJogo[ev.pid] || {};
        m.statsJogo[ev.pid].falha = Math.max(0, (m.statsJogo[ev.pid].falha||0)-1);
        if(ev.falhaTipo && m.statsJogo[ev.pid].falhaTipos){
          const pos = m.statsJogo[ev.pid].falhaTipos.indexOf(ev.falhaTipo);
          if(pos>=0) m.statsJogo[ev.pid].falhaTipos.splice(pos,1);
        }
      } else if(ev.tipo==='cartao' && ev.pid && ev.cor){
        m.cartoes = m.cartoes || {};
        m.cartoes[ev.pid] = m.cartoes[ev.pid] || {amarelo:0,vermelho:0,azul:0};
        m.cartoes[ev.pid][ev.cor] = Math.max(0, (m.cartoes[ev.pid][ev.cor]||0)-1);
      }
      // substituição/troca: remove só a linha do histórico, sem desfazer a troca de jogador
      m.eventos.splice(idx,1);
      await saveData(); showToast('Evento removido!'); render();
    }

    const iniciarTimerBtn = document.querySelector('[data-action="iniciar-timer"]');
    if(iniciarTimerBtn) iniciarTimerBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      m.timer = m.timer || {rodando:false, inicioTs:null, acumuladoMs:0};
      m.timer.rodando = true; m.timer.inicioTs = Date.now();
      await saveData(); render();
    };
    const pausarTimerBtn = document.querySelector('[data-action="pausar-timer"]');
    if(pausarTimerBtn) pausarTimerBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      m.timer.acumuladoMs = timerElapsedMs(m);
      m.timer.rodando = false; m.timer.inicioTs = null;
      await saveData(); render();
    };

    const salvarAvalBtn = document.querySelector('[data-action="salvar-avaliacoes"]');
    if(salvarAvalBtn) salvarAvalBtn.onclick = async ()=>{
      const m = matchById(salvarAvalBtn.dataset.mid);
      const obj = {};
      document.querySelectorAll('[data-avaliar]').forEach(sel=>{
        if(sel.value!=='') obj[sel.dataset.avaliar] = parseInt(sel.value);
      });
      delete obj[me]; // segurança: nunca aceitar autoavaliação
      m.avaliacoesFeitas = m.avaliacoesFeitas || {};
      m.avaliacoesFeitas[me] = obj;
      ui.mercadoSub = null;
      await saveData(); showToast('Avaliações salvas!'); render();
    };

    document.querySelectorAll('[data-toggle-veto]').forEach(el=> el.onclick = async ()=>{
      const pid = el.dataset.toggleVeto;
      const meuPlayer = myPlayer();
      meuPlayer.vetos = meuPlayer.vetos || [];
      const i = meuPlayer.vetos.indexOf(pid);
      if(i>=0) meuPlayer.vetos.splice(i,1); else meuPlayer.vetos.push(pid);
      await saveData(); showToast(i>=0?'Veto removido':'Jogador vetado — as notas dele não entram mais na sua média'); render();
    });

    const finalizarBtn = document.querySelector('[data-action="finalizar"]');
    if(finalizarBtn) finalizarBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      if(m.timer && m.timer.rodando){ m.timer.acumuladoMs = timerElapsedMs(m); m.timer.rodando=false; m.timer.inicioTs=null; }
      m.status = 'finalizada';
      applyMatchResultStats(m);
      logAtividade(groupById(m.groupId), 'encerrou a pelada');
      ui.matchTab = 'avaliacoes'; ui.mercadoSub = null; ui.pedirSaidaTime = false;
      await saveData(); showToast('Pelada encerrada!'); render();
    };

    const fimDeJogoBtn = document.querySelector('[data-action="fim-de-jogo"]');
    if(fimDeJogoBtn) fimDeJogoBtn.onclick = async ()=>{
      const m = matchById(ui.matchId);
      if(m.timer && m.timer.rodando){ m.timer.acumuladoMs = timerElapsedMs(m); m.timer.rodando=false; m.timer.inicioTs=null; }
      if((m.filaIdx||[]).length>0){
        ui.pedirSaidaTime = true; await saveData(); render();
        return;
      }
      // sem ninguém na fila pra entrar: não tem próximo jogo, encerra a pelada
      m.status = 'finalizada';
      applyMatchResultStats(m);
      logAtividade(groupById(m.groupId), 'finalizou a partida');
      ui.matchTab = 'avaliacoes'; ui.mercadoSub = null;
      await saveData(); showToast('Partida finalizada!'); render();
    };

    document.querySelectorAll('[data-sai-time]').forEach(el=> el.onclick = async ()=>{
      const escolha = el.dataset.saiTime;
      const mAntiga = matchById(ui.matchId);
      mAntiga.status = 'finalizada';
      applyMatchResultStats(mAntiga);
      let fila = (mAntiga.filaIdx||[]).slice();
      let novoTimeA, novoTimeB;
      if(escolha==='ambos'){
        novoTimeA = fila.shift(); novoTimeB = fila.shift();
        fila.push(mAntiga.timeA, mAntiga.timeB);
      } else if(escolha==='A'){
        novoTimeA = fila.shift(); novoTimeB = mAntiga.timeB;
        fila.push(mAntiga.timeA);
      } else {
        novoTimeB = fila.shift(); novoTimeA = mAntiga.timeA;
        fila.push(mAntiga.timeB);
      }
      const nova = { id: uid(), groupId: mAntiga.groupId, date: mAntiga.date, time: mAntiga.time, local: mAntiga.local, valor: mAntiga.valor,
        confirmed:[...mAntiga.confirmed], maybe:[], declined:[], waitlist:[], status: (novoTimeA!=null&&novoTimeB!=null)?'sorteada':'aberta',
        positionByPlayer:{...mAntiga.positionByPlayer},
        confirmInicioData:mAntiga.confirmInicioData, confirmInicioHora:mAntiga.confirmInicioHora,
        confirmFimData:mAntiga.confirmFimData, confirmFimHora:mAntiga.confirmFimHora,
        times: mAntiga.times, timeA: novoTimeA, timeB: novoTimeB, filaIdx: fila,
        timeNomes: mAntiga.timeNomes, timeCores: mAntiga.timeCores, numSorteios: mAntiga.numSorteios,
        placar:{A:0,B:0}, golsPorJogador:{}, pagamentos:{}, cartoes:{}, avaliacoesFeitas:{},
        chegadas:{...mAntiga.chegadas}, statsJogo:{}, timer:{rodando:false,inicioTs:null,acumuladoMs:0} };
      data.matches.push(nova);
      ui.matchId = nova.id; ui.pedirSaidaTime=false; ui.matchTab='partida'; ui.matchSubTab='times';
      await saveData(); showToast('Times trocados! Toque em Iniciar partida quando estiver pronto.'); render();
    });

    const logoutBtn = document.querySelector('[data-action="logout"]');
    if(logoutBtn) logoutBtn.onclick = async ()=>{
      ui.loginPhone='';
      try{ await signOut(auth); }catch(e){}
    };

    ensureTimerInterval();
  }

  function ensureTimerInterval(){
    if(window.__peladaTimerInt){ clearInterval(window.__peladaTimerInt); window.__peladaTimerInt=null; }
    if(view==='partida-detalhe' && ui.matchTab==='partida' && (ui.matchSubTab||'chegadas')==='acoes'){
      const m = matchById(ui.matchId);
      if(m && m.timer && m.timer.rodando){
        window.__peladaTimerInt = setInterval(()=>{
          const el = document.getElementById('timer-display');
          if(el){ el.textContent = fmtTimer(timerElapsedMs(m)); } else { clearInterval(window.__peladaTimerInt); }
        }, 1000);
      }
    }
    if(window.__mercadoCountdownInt){ clearInterval(window.__mercadoCountdownInt); window.__mercadoCountdownInt=null; }
    if(view==='partida-detalhe' && ui.matchTab==='avaliacoes' && !ui.mercadoSub){
      const m = matchById(ui.matchId); const g = m ? groupById(m.groupId) : null;
      if(m && g && m.status==='finalizada'){
        window.__mercadoCountdownInt = setInterval(()=>{
          const el = document.getElementById('mercado-countdown');
          if(!el){ clearInterval(window.__mercadoCountdownInt); return; }
          const prazo = avaliacaoPrazo(m,g);
          el.textContent = fmtContagem(prazo.limite-Date.now());
        }, 1000);
      }
    }
  }

  loadAll();
})();
</script>
</body>
</html>
